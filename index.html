<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Calorímetro</title>

    <!-- PWA -->
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#020205" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Calorímetro" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800;900&display=swap" rel="stylesheet" />

    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #020205; color: #e2e8f0; min-height: 100vh; padding-bottom: 40px; transition: background-color 0.3s, color 0.3s; }

        /* Modo claro — misma paleta pastel cálida que Quantum Finance */
        body.light-mode { background-color: #f4efe6; color: #2b2620; }
        body.light-mode .bg-white\/5 { background-color: #efe8da; }
        body.light-mode .border-white\/10 { border-color: rgba(43,38,32,0.1); }
        body.light-mode .border-white\/5 { border-color: rgba(43,38,32,0.07); }
        body.light-mode .bg-black\/30 { background-color: rgba(43,38,32,0.05); }
        body.light-mode .bg-black\/40 { background-color: rgba(43,38,32,0.07); }
        body.light-mode .text-slate-400 { color: #79725f; }
        body.light-mode .text-slate-300 { color: #4a4436; }
        body.light-mode .text-white { color: #2b2620; }
        body.light-mode .border-indigo-500\/20 { border-color: rgba(124,110,201,0.25); }
        body.light-mode .border-indigo-500\/30 { border-color: rgba(124,110,201,0.35); }
        body.light-mode .text-indigo-400, body.light-mode .text-indigo-300 { color: #6a5bc2; }
        body.light-mode .text-rose-400 { color: #b8496a; }
        body.light-mode .text-emerald-400, body.light-mode .text-emerald-300 { color: #3f9e78; }
        body.light-mode .text-amber-400 { color: #b3823a; }
        body.light-mode .bg-indigo-600 { background-color: #7c6ec9; }
        body.light-mode .bg-indigo-600:hover { background-color: #6a5bc2; }
        body.light-mode .bg-indigo-500\/10 { background-color: rgba(124,110,201,0.1); }
        body.light-mode .bg-indigo-500\/20 { background-color: rgba(124,110,201,0.16); }
        body.light-mode .bg-rose-500\/10 { background-color: rgba(199,107,138,0.1); }
        body.light-mode .bg-rose-500\/20 { background-color: rgba(199,107,138,0.16); }
        body.light-mode .bg-emerald-500\/10 { background-color: rgba(79,172,134,0.1); }
        body.light-mode .bg-emerald-500\/20 { background-color: rgba(79,172,134,0.16); }
        body.light-mode .bg-amber-500\/10 { background-color: rgba(179,130,58,0.1); }
        body.light-mode .bg-amber-500\/20 { background-color: rgba(179,130,58,0.16); }
        body.light-mode .bg-\[\#0f111a\] { background-color: #fbf8f2; border-color: rgba(43,38,32,0.1) !important; }
        body.light-mode .bg-black\/80 { background-color: rgba(43,38,32,0.35); }
        body.light-mode .toast { background: #fbf8f2; border-color: rgba(43,38,32,0.1); color: #2b2620; }
        body.light-mode .theme-toggle { background: rgba(43,38,32,0.05); border-color: rgba(43,38,32,0.1); color: #2b2620; }
        body.light-mode input, body.light-mode select { background-color: rgba(43,38,32,0.03) !important; color: #2b2620 !important; }
        body.light-mode input::placeholder { color: #9b927c; }
        body.light-mode .bg-slate-700\/50 { background-color: rgba(43,38,32,0.06); }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(6px) scale(0.99); } to { opacity:1; transform:translateY(0) scale(1); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        @keyframes slideIn { from { opacity:0; transform:translateX(20px); } to { opacity:1; transform:translateX(0); } }
        .animate-fade { animation: fadeIn 0.2s ease-out forwards; }
        .entry-enter { animation: slideIn 0.25s ease-out forwards; }
        input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }
        .theme-toggle { cursor: pointer; transition: all 0.2s; font-size: 0.9rem; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); }
        .theme-toggle:hover { background: rgba(255,255,255,0.1); }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; height: 100dvh; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #0f111a; border: 1px solid rgba(255,255,255,0.1); padding: 12px 24px; border-radius: 16px; font-weight: 700; font-size: 0.8rem; z-index: 100; animation: fadeIn 0.3s ease-out; backdrop-filter: blur(8px); box-shadow: 0 8px 32px rgba(0,0,0,0.4); max-width: 90vw; text-align: center; }
        .mic-btn { transition: all 0.3s ease; }
        .mic-btn.active { background: rgba(239, 68, 68, 0.3); border-color: rgba(239, 68, 68, 0.5); animation: pulse 1s ease-in-out infinite; }
        .mic-hero { transition: all 0.25s ease; }
        .mic-hero.active { animation: pulse 1s ease-in-out infinite; }
        .mic-hero:active { transform: scale(0.94); }
        .kcal-hero { font-size: 2.6rem; font-weight: 900; line-height: 1.1; letter-spacing: -0.01em; }
    </style>
</head>
<body>
<div id="root" class="max-w-md mx-auto px-3 pt-3"></div>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

const STORAGE_KEY = 'calorimetro_entries';
const THEME_KEY = 'calorimetro_theme';
const API_KEY_STORAGE = 'calorimetro_api_key';
const GUIDE_SHOWN_KEY = 'calorimetro_voice_guide_shown';

const EMPTY_FORM = { alimento: '', calorias: '', proteinas: '', carbohidratos: '', grasas: '', fecha: new Date().toISOString().slice(0, 10) };

const loadEntries = () => {
    try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) return JSON.parse(saved);
    } catch (e) {}
    return [];
};
const saveEntries = (list) => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); } catch (e) {} };

const todayStr = () => new Date().toISOString().slice(0, 10);

const formatFechaAmigable = (fechaStr) => {
    const hoy = new Date(); hoy.setHours(0,0,0,0);
    const ayer = new Date(hoy); ayer.setDate(ayer.getDate() - 1);
    const fecha = new Date(fechaStr + 'T00:00:00');
    if (fecha.getTime() === hoy.getTime()) return 'Hoy';
    if (fecha.getTime() === ayer.getTime()) return 'Ayer';
    const diffDias = Math.floor((hoy.getTime() - fecha.getTime()) / 86400000);
    if (diffDias < 7 && diffDias >= 0) {
        const dias = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
        return dias[fecha.getDay()];
    }
    return `${fecha.getDate()} ${fecha.toLocaleString('es', { month: 'short' })}`;
};

const App = () => {
    const [entries, setEntries] = useState(() => loadEntries());
    const [modalOpen, setModalOpen] = useState(false);
    const [editingId, setEditingId] = useState(null);
    const [formData, setFormData] = useState(EMPTY_FORM);
    const [toast, setToast] = useState(null);
    const [isListening, setIsListening] = useState(false);
    const [isOnline, setIsOnline] = useState(navigator.onLine);
    const [aiLoading, setAiLoading] = useState(false);
    const [showCreator, setShowCreator] = useState(false);
    const [showGuide, setShowGuide] = useState(false);
    const [guideTab, setGuideTab] = useState('voz');
    const [apiKey, setApiKeyState] = useState(() => localStorage.getItem(API_KEY_STORAGE) || '');
    const [showSettings, setShowSettings] = useState(false);
    const [apiKeyDraft, setApiKeyDraft] = useState('');
    const [voiceGuideShown, setVoiceGuideShown] = useState(() => localStorage.getItem(GUIDE_SHOWN_KEY) === 'true');
    const inputRef = useRef(null);
    const recognitionRef = useRef(null);

    const [theme, setTheme] = useState(() => localStorage.getItem(THEME_KEY) || 'dark');

    useEffect(() => {
        document.body.classList.toggle('light-mode', theme === 'light');
        localStorage.setItem(THEME_KEY, theme);
    }, [theme]);

    useEffect(() => { saveEntries(entries); }, [entries]);

    useEffect(() => {
        const handleOnline = () => setIsOnline(true);
        const handleOffline = () => setIsOnline(false);
        window.addEventListener('online', handleOnline);
        window.addEventListener('offline', handleOffline);
        return () => {
            window.removeEventListener('online', handleOnline);
            window.removeEventListener('offline', handleOffline);
        };
    }, []);

    useEffect(() => {
        if (toast) {
            const timer = setTimeout(() => setToast(null), 4000);
            return () => clearTimeout(timer);
        }
    }, [toast]);

    useEffect(() => {
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(() => {});
            });
        }
    }, []);

    const toggleTheme = () => setTheme(prev => prev === 'dark' ? 'light' : 'dark');

    // ============================================================
    //  GEMINI — análisis nutricional estructurado
    // ============================================================
    const analyzeWithGemini = async (userText) => {
        if (!apiKey) {
            setToast('⚠️ Añade tu API Key de Gemini en Ajustes');
            setShowSettings(true);
            return null;
        }
        const prompt = `Eres un nutricionista experto. Analiza esta comida descrita por voz o texto: "${userText}"

Responde ÚNICAMENTE con un objeto JSON válido, sin markdown, sin backticks y sin texto antes o después, con exactamente estas claves:
{"alimento": "nombre corto del alimento o comida", "calorias": numero, "proteinas": numero, "carbohidratos": numero, "grasas": numero, "reconocido": true_o_false}

Cantidades totales estimadas en kcal y gramos, redondeadas a enteros. Si la frase no describe comida, responde "reconocido": false y el resto en 0.`;
        try {
            const response = await fetch(
                `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                }
            );
            if (!response.ok) {
                const errData = await response.json().catch(() => ({}));
                throw new Error(errData.error?.message || ('Error HTTP ' + response.status));
            }
            const data = await response.json();
            let raw = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
            raw = raw.trim().replace(/^```json/i, '').replace(/^```/, '').replace(/```$/, '').trim();
            const parsed = JSON.parse(raw);
            if (!parsed.reconocido) {
                setToast('🤔 No reconocido, intenta describirlo de otra forma');
                return null;
            }
            return parsed;
        } catch (err) {
            setToast('⚠️ Error con Gemini: ' + err.message);
            return null;
        }
    };

    // ============================================================
    //  VOZ — flujo principal (botón grande de la pantalla)
    // ============================================================
    const startVoiceRecognition = () => {
        if (!isOnline) { setToast('⚠️ Sin conexión a internet'); return; }
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) { setToast('⚠️ Tu navegador no soporta voz'); return; }

        const rec = new SpeechRecognition();
        recognitionRef.current = rec;
        rec.lang = 'es-ES';
        rec.continuous = false;
        rec.interimResults = false;
        rec.maxAlternatives = 1;

        rec.onstart = () => { setIsListening(true); setToast('🎙️ Escuchando... habla claro'); };
        rec.onerror = (event) => {
            if (event.error === 'not-allowed') setToast('⚠️ Permiso de micrófono denegado');
            else if (event.error === 'no-speech') setToast('⚠️ No te he escuchado, intenta de nuevo');
            else setToast('⚠️ Error: ' + event.error);
            setIsListening(false);
        };
        rec.onend = () => setIsListening(false);
        rec.onresult = async (event) => {
            const text = event.results[0][0].transcript.trim();
            setToast('🧠 Analizando con IA...');
            const parsed = await analyzeWithGemini(text);
            if (parsed) {
                setFormData({
                    alimento: parsed.alimento || text,
                    calorias: Math.round(parsed.calorias || 0),
                    proteinas: Math.round(parsed.proteinas || 0),
                    carbohidratos: Math.round(parsed.carbohidratos || 0),
                    grasas: Math.round(parsed.grasas || 0),
                    fecha: todayStr()
                });
                setEditingId(null);
                setModalOpen(true);
                setToast('✅ Revisa y guarda');
            }
        };
        try { rec.start(); } catch (e) { setToast('⚠️ Error al iniciar el micrófono'); }
    };

    // ============================================================
    //  VOZ — dictado del concepto dentro del modal
    // ============================================================
    const dictateConceptInModal = () => {
        if (!isOnline) { setToast('⚠️ Sin conexión a internet'); return; }
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) { setToast('⚠️ Tu navegador no soporta voz'); return; }
        const rec = new SpeechRecognition();
        rec.lang = 'es-ES';
        rec.continuous = false;
        rec.interimResults = false;
        rec.onstart = () => setIsListening(true);
        rec.onerror = () => setIsListening(false);
        rec.onend = () => setIsListening(false);
        rec.onresult = (event) => {
            const text = event.results[0][0].transcript.trim();
            setFormData(prev => ({ ...prev, alimento: text }));
        };
        try { rec.start(); } catch (e) {}
    };

    const analyzeConceptFromModal = async () => {
        if (!formData.alimento) { setToast('⚠️ Escribe o dicta primero el alimento'); return; }
        setAiLoading(true);
        const parsed = await analyzeWithGemini(formData.alimento);
        setAiLoading(false);
        if (parsed) {
            setFormData(prev => ({
                ...prev,
                alimento: parsed.alimento || prev.alimento,
                calorias: Math.round(parsed.calorias || 0),
                proteinas: Math.round(parsed.proteinas || 0),
                carbohidratos: Math.round(parsed.carbohidratos || 0),
                grasas: Math.round(parsed.grasas || 0)
            }));
            setToast('✅ Valores estimados por IA');
        }
    };

    // ============================================================
    //  CRUD ENTRADAS
    // ============================================================
    const handleOpenAdd = () => {
        setFormData({ ...EMPTY_FORM, fecha: todayStr() });
        setEditingId(null);
        setModalOpen(true);
    };
    const handleOpenEdit = (entry) => {
        setFormData({
            alimento: entry.alimento, calorias: entry.calorias, proteinas: entry.proteinas,
            carbohidratos: entry.carbohidratos, grasas: entry.grasas, fecha: entry.date
        });
        setEditingId(entry.id);
        setModalOpen(true);
    };
    const handleCloseModal = () => { setModalOpen(false); setEditingId(null); setFormData(EMPTY_FORM); };

    const handleSaveEntry = (e) => {
        e.preventDefault();
        if (editingId) {
            setEntries(prev => prev.map(en => en.id === editingId ? {
                ...en, alimento: formData.alimento, date: formData.fecha,
                calorias: Number(formData.calorias) || 0, proteinas: Number(formData.proteinas) || 0,
                carbohidratos: Number(formData.carbohidratos) || 0, grasas: Number(formData.grasas) || 0
            } : en));
            setToast('✅ Registro actualizado');
        } else {
            const now = new Date();
            setEntries(prev => [...prev, {
                id: Date.now(), date: formData.fecha,
                hora: now.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }),
                alimento: formData.alimento || 'Alimento',
                calorias: Number(formData.calorias) || 0, proteinas: Number(formData.proteinas) || 0,
                carbohidratos: Number(formData.carbohidratos) || 0, grasas: Number(formData.grasas) || 0
            }]);
            setToast('✅ Registrado');
        }
        handleCloseModal();
    };
    const handleDelete = (id) => {
        setEntries(prev => prev.filter(en => en.id !== id));
        setToast('🗑️ Registro eliminado');
    };
    const handleClearHistory = () => {
        if (confirm('¿Borrar todo el historial? No se puede deshacer.')) {
            setEntries([]);
            setToast('🗑️ Historial borrado');
        }
    };

    const saveApiKey = () => {
        localStorage.setItem(API_KEY_STORAGE, apiKeyDraft.trim());
        setApiKeyState(apiKeyDraft.trim());
        setShowSettings(false);
        setToast('✅ API Key guardada');
    };

    const dismissVoiceGuide = () => {
        setVoiceGuideShown(true);
        localStorage.setItem(GUIDE_SHOWN_KEY, 'true');
    };

    // ============================================================
    //  DATOS DERIVADOS
    // ============================================================
    const todayKey = todayStr();
    const todayEntries = useMemo(() => entries.filter(e => e.date === todayKey).sort((a,b) => b.id - a.id), [entries, todayKey]);
    const todayTotals = useMemo(() => todayEntries.reduce((acc, e) => ({
        kcal: acc.kcal + e.calorias, prot: acc.prot + e.proteinas, carb: acc.carb + e.carbohidratos, fat: acc.fat + e.grasas
    }), { kcal: 0, prot: 0, carb: 0, fat: 0 }), [todayEntries]);

    const pastDays = useMemo(() => {
        const byDay = {};
        entries.forEach(e => { if (e.date === todayKey) return; byDay[e.date] = (byDay[e.date] || 0) + e.calorias; });
        return Object.keys(byDay).sort().reverse().map(d => ({ date: d, kcal: byDay[d] }));
    }, [entries, todayKey]);

    return (
        <div className="space-y-4 animate-fade pb-8">
            {toast && <div className="toast">{toast}</div>}

            {!voiceGuideShown && ReactDOM.createPortal(
                <div className="modal-overlay bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                    <div className="bg-[#0f111a] border border-white/10 p-8 rounded-[2.5rem] w-full max-w-sm shadow-2xl animate-fade text-center relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-indigo-500 via-purple-500 to-emerald-500"></div>
                        <div className="w-20 h-20 mx-auto bg-indigo-500/10 rounded-full flex items-center justify-center mb-5 border border-indigo-500/20">
                            <i className="fa-solid fa-microphone text-4xl text-indigo-400"></i>
                        </div>
                        <h3 className="text-xl font-black text-white mb-2">🎙️ Dicta lo que comes</h3>
                        <p className="text-sm text-slate-400 mb-4">Sin escribir, solo habla</p>
                        <div className="bg-black/40 p-4 rounded-2xl border border-white/5 text-left space-y-3 mb-6">
                            <div className="flex items-center gap-3"><span className="text-indigo-400 text-sm">💬</span><span className="text-slate-300 text-sm">"dos huevos fritos con pan"</span></div>
                            <div className="flex items-center gap-3"><span className="text-indigo-400 text-sm">💬</span><span className="text-slate-300 text-sm">"un plátano y un café con leche"</span></div>
                            <div className="flex items-center gap-3"><span className="text-indigo-400 text-sm">💬</span><span className="text-slate-300 text-sm">"pechuga de pollo con arroz"</span></div>
                        </div>
                        <div className="text-xs text-slate-400 space-y-2 text-left mb-6">
                            <p>📌 La IA calcula calorías y macros por ti</p>
                            <p>🔄 Puedes corregir cualquier valor antes de guardar</p>
                            <p>⚡ Necesita conexión a internet</p>
                        </div>
                        <button onClick={dismissVoiceGuide} className="w-full py-4 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-black text-sm transition-all shadow-lg active:scale-95">
                            ENTENDIDO
                        </button>
                    </div>
                </div>, document.body
            )}

            {/* HEADER */}
            <div className="flex justify-between items-center bg-white/5 border border-white/10 p-4 rounded-2xl backdrop-blur-md gap-2">
                <div>
                    <div className="flex items-center gap-3 flex-wrap">
                        <h1 className="text-lg font-black text-white tracking-tight">Calorímetro</h1>
                        <span className={`text-[12px] font-bold px-2 py-1 rounded-full ${todayTotals.kcal > 0 ? 'bg-indigo-500/20 text-indigo-300 border border-indigo-500/20' : 'bg-white/5 text-slate-400'}`}>
                            Hoy: {Math.round(todayTotals.kcal)} kcal
                        </span>
                    </div>
                    <p className="text-[12px] text-slate-400 uppercase tracking-widest mt-0.5">
                        {isOnline ? 'Listo para escuchar' : 'Sin conexión'}
                    </p>
                </div>
                <div className="flex items-center gap-2">
                    <button onClick={toggleTheme} className="theme-toggle" title="Cambiar tema">
                        <i className={`fa-solid ${theme === 'dark' ? 'fa-sun' : 'fa-moon'}`}></i>
                    </button>
                    <button onClick={() => { setApiKeyDraft(apiKey); setShowSettings(true); }} className="bg-white/10 hover:bg-white/20 text-white w-9 h-9 rounded-xl font-bold text-xs shadow-lg active:scale-95 transition-transform flex items-center justify-center" title="Ajustes">
                        <i className="fa-solid fa-gear"></i>
                    </button>
                </div>
            </div>

            {/* RESUMEN DE HOY */}
            <div className="bg-white/5 border border-white/10 rounded-3xl p-5">
                <div className="flex items-end justify-between mb-4">
                    <div>
                        <div className="kcal-hero text-white">{Math.round(todayTotals.kcal)}</div>
                        <div className="text-[11px] font-bold text-slate-400 uppercase tracking-widest">kcal de hoy</div>
                    </div>
                </div>
                <div className="grid grid-cols-3 gap-2">
                    <div className="bg-emerald-500/10 border border-emerald-500/20 rounded-xl p-2.5 text-center">
                        <div className="text-emerald-400 font-black text-sm">{Math.round(todayTotals.prot)}g</div>
                        <div className="text-[10px] text-slate-400 uppercase tracking-wider font-bold">Proteína</div>
                    </div>
                    <div className="bg-amber-500/10 border border-amber-500/20 rounded-xl p-2.5 text-center">
                        <div className="text-amber-400 font-black text-sm">{Math.round(todayTotals.carb)}g</div>
                        <div className="text-[10px] text-slate-400 uppercase tracking-wider font-bold">Carbos</div>
                    </div>
                    <div className="bg-rose-500/10 border border-rose-500/20 rounded-xl p-2.5 text-center">
                        <div className="text-rose-400 font-black text-sm">{Math.round(todayTotals.fat)}g</div>
                        <div className="text-[10px] text-slate-400 uppercase tracking-wider font-bold">Grasa</div>
                    </div>
                </div>
            </div>

            {/* BOTÓN DE VOZ PRINCIPAL */}
            <div className="flex flex-col items-center gap-3 py-2">
                <button
                    onClick={startVoiceRecognition}
                    disabled={!isOnline}
                    className={`mic-hero w-24 h-24 rounded-full flex items-center justify-center text-3xl shadow-2xl border ${isListening ? 'active bg-rose-500/30 border-rose-500/50 text-rose-400' : isOnline ? 'bg-indigo-600 border-indigo-400/30 text-white hover:bg-indigo-500' : 'bg-slate-700/50 border-slate-600/30 text-slate-400 cursor-not-allowed'}`}
                    title={isOnline ? 'Dictar comida' : 'Sin conexión a internet'}
                >
                    <i className={`fa-solid ${isListening ? 'fa-circle-stop' : 'fa-microphone'}`}></i>
                </button>
                <p className="text-xs text-slate-400 font-bold uppercase tracking-widest">
                    {isListening ? 'Escuchando...' : 'Toca y describe qué comiste'}
                </p>
                <button onClick={handleOpenAdd} className="text-[12px] font-bold text-indigo-400 hover:text-indigo-300 flex items-center gap-1.5">
                    <i className="fa-solid fa-plus"></i> Añadir manual
                </button>
            </div>

            {/* HISTORIAL DE HOY */}
            <div className="bg-white/5 border border-white/10 rounded-3xl p-5">
                <h3 className="text-xs font-black text-slate-400 uppercase tracking-wider mb-3">Registrado hoy</h3>
                <div className="space-y-2 max-h-72 overflow-y-auto custom-scrollbar pr-1">
                    {todayEntries.length === 0 && <p className="text-slate-400 text-xs text-center py-4">Aún no has registrado nada hoy.</p>}
                    {todayEntries.map((entry, idx) => (
                        <div key={entry.id} className="entry-enter p-3 rounded-xl bg-black/40 border border-white/5 text-xs" style={{ animationDelay: `${idx * 0.05}s` }}>
                            <div className="flex justify-between items-center">
                                <div>
                                    <p className="font-bold text-white">{entry.alimento}</p>
                                    <p className="text-[12px] text-slate-400 mt-0.5">{entry.hora} · {Math.round(entry.proteinas)}p / {Math.round(entry.carbohidratos)}c / {Math.round(entry.grasas)}g</p>
                                </div>
                                <div className="flex items-center gap-3">
                                    <span className="font-black text-indigo-400">{Math.round(entry.calorias)} kcal</span>
                                    <div className="flex gap-1">
                                        <button onClick={() => handleOpenEdit(entry)} className="text-slate-400 hover:text-indigo-400 p-1"><i className="fa-solid fa-pen text-xs"></i></button>
                                        <button onClick={() => handleDelete(entry.id)} className="text-slate-400 hover:text-rose-400 p-1"><i className="fa-solid fa-trash text-xs"></i></button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    ))}
                </div>
            </div>

            {/* DÍAS ANTERIORES */}
            <div className="bg-white/5 border border-white/10 rounded-3xl p-5">
                <div className="flex justify-between items-center mb-3">
                    <h3 className="text-xs font-black text-slate-400 uppercase tracking-wider">Días anteriores</h3>
                    {pastDays.length > 0 && (
                        <button onClick={handleClearHistory} className="text-[11px] font-bold text-rose-400 hover:text-rose-300">Borrar historial</button>
                    )}
                </div>
                <div className="space-y-2">
                    {pastDays.length === 0 && <p className="text-slate-400 text-xs text-center py-2">Sin registros anteriores.</p>}
                    {pastDays.map(d => (
                        <div key={d.date} className="flex justify-between items-center px-3 py-2.5 rounded-xl bg-black/30 text-xs">
                            <span className="text-slate-300 font-semibold">{formatFechaAmigable(d.date)}</span>
                            <span className="text-indigo-400 font-black">{Math.round(d.kcal)} kcal</span>
                        </div>
                    ))}
                </div>
            </div>

            {/* HUELLA DEL CREADOR */}
            <div className="mt-2 flex justify-center pb-2">
                <button onClick={() => setShowCreator(true)} className="flex flex-col items-center gap-2 text-slate-600 hover:text-indigo-400 transition-colors group">
                    <i className="fa-solid fa-fingerprint text-xl group-hover:scale-110 transition-transform"></i>
                    <span className="text-[9px] font-black uppercase tracking-widest">Creador</span>
                </button>
            </div>

            {/* FAB GUÍA */}
            <button onClick={() => setShowGuide(true)} className="fixed bottom-6 right-6 z-40 w-14 h-14 rounded-full bg-indigo-600 hover:bg-indigo-500 text-white shadow-2xl flex items-center justify-center transition-colors" title="Guía de usuario">
                <i className="fa-solid fa-circle-question text-xl"></i>
            </button>

            {/* MODAL AÑADIR/EDITAR */}
            {modalOpen && ReactDOM.createPortal(
                <div className="modal-overlay bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center z-50 p-0 sm:p-4">
                    <div className="bg-[#0f111a] border border-white/10 p-6 rounded-t-[2.5rem] sm:rounded-[2rem] w-full max-w-sm shadow-2xl animate-fade">
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="text-base font-black text-white">{editingId ? 'Editar Registro' : 'Añadir Comida'}</h3>
                            <button onClick={handleCloseModal} className="text-slate-400 hover:text-white transition-colors p-1"><i className="fa-solid fa-xmark text-lg"></i></button>
                        </div>
                        <form onSubmit={handleSaveEntry} className="space-y-3">
                            <div>
                                <label className="text-[12px] font-bold text-slate-400 uppercase tracking-widest mb-1 block">Alimento</label>
                                <div className="flex gap-2 items-center">
                                    <input
                                        ref={inputRef} type="text" value={formData.alimento}
                                        onChange={e => setFormData({ ...formData, alimento: e.target.value })}
                                        className="flex-1 bg-white/5 border border-white/10 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-indigo-500"
                                        placeholder="Ej: dos huevos fritos con pan" required
                                    />
                                    <button type="button" onClick={dictateConceptInModal} disabled={!isOnline}
                                        className={`mic-btn p-3 rounded-xl border transition-all flex-shrink-0 relative ${isListening ? 'active bg-rose-500/20 border-rose-500/50 text-rose-400' : isOnline ? 'bg-indigo-500/20 border-indigo-500/30 text-indigo-400 hover:bg-indigo-500/30' : 'bg-slate-700/50 border-slate-600/30 text-slate-400 cursor-not-allowed'}`}
                                        title={isOnline ? 'Dictar por voz' : 'Sin conexión'}>
                                        <i className={`fa-solid ${isListening ? 'fa-circle-stop' : 'fa-microphone'}`}></i>
                                    </button>
                                </div>
                                <button type="button" onClick={analyzeConceptFromModal} disabled={aiLoading || !isOnline}
                                    className="mt-2 text-[12px] font-bold text-indigo-400 hover:text-indigo-300 flex items-center gap-1.5 disabled:opacity-40">
                                    <i className={`fa-solid ${aiLoading ? 'fa-spinner fa-spin' : 'fa-wand-magic-sparkles'}`}></i>
                                    {aiLoading ? 'Analizando...' : 'Analizar con IA'}
                                </button>
                            </div>
                            <div className="grid grid-cols-2 gap-3">
                                <div>
                                    <label className="text-[12px] font-bold text-slate-400 uppercase tracking-widest mb-1 block">Calorías</label>
                                    <input type="number" inputMode="numeric" value={formData.calorias}
                                        onChange={e => setFormData({ ...formData, calorias: e.target.value })}
                                        className="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-indigo-500" placeholder="0" required />
                                </div>
                                <div>
                                    <label className="text-[12px] font-bold text-slate-400 uppercase tracking-widest mb-1 block">Fecha</label>
                                    <input type="date" value={formData.fecha} onChange={e => setFormData({ ...formData, fecha: e.target.value })}
                                        className="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-indigo-500" required />
                                </div>
                            </div>
                            <div className="grid grid-cols-3 gap-3">
                                <div>
                                    <label className="text-[11px] font-bold text-emerald-400 uppercase tracking-widest mb-1 block">Prot. (g)</label>
                                    <input type="number" inputMode="numeric" value={formData.proteinas} onChange={e => setFormData({ ...formData, proteinas: e.target.value })}
                                        className="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-emerald-500" placeholder="0" />
                                </div>
                                <div>
                                    <label className="text-[11px] font-bold text-amber-400 uppercase tracking-widest mb-1 block">Carb. (g)</label>
                                    <input type="number" inputMode="numeric" value={formData.carbohidratos} onChange={e => setFormData({ ...formData, carbohidratos: e.target.value })}
                                        className="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-amber-500" placeholder="0" />
                                </div>
                                <div>
                                    <label className="text-[11px] font-bold text-rose-400 uppercase tracking-widest mb-1 block">Grasa (g)</label>
                                    <input type="number" inputMode="numeric" value={formData.grasas} onChange={e => setFormData({ ...formData, grasas: e.target.value })}
                                        className="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-rose-500" placeholder="0" />
                                </div>
                            </div>
                            <div className="flex gap-2 mt-2">
                                <button type="submit" className="flex-1 py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-black text-sm transition-all shadow-lg active:scale-95">
                                    {editingId ? 'ACTUALIZAR' : 'GUARDAR'}
                                </button>
                                <button type="button" onClick={handleCloseModal} className="py-3.5 px-4 bg-white/5 hover:bg-white/10 text-slate-400 rounded-xl font-bold text-sm transition-all active:scale-95">
                                    CANCELAR
                                </button>
                            </div>
                        </form>
                    </div>
                </div>, document.body
            )}

            {/* MODAL AJUSTES (API KEY) */}
            {showSettings && ReactDOM.createPortal(
                <div className="modal-overlay bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center z-50 p-0 sm:p-4">
                    <div className="bg-[#0f111a] border border-white/10 p-6 rounded-t-[2.5rem] sm:rounded-[2rem] w-full max-w-sm shadow-2xl animate-fade">
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="text-base font-black text-white">⚙️ Ajustes</h3>
                            <button onClick={() => setShowSettings(false)} className="text-slate-400 hover:text-white p-1"><i className="fa-solid fa-xmark text-lg"></i></button>
                        </div>
                        <div className="mb-4">
                            <label className="text-[12px] font-bold text-slate-400 uppercase tracking-widest mb-1 block">API Key de Gemini</label>
                            <input type="password" value={apiKeyDraft} onChange={e => setApiKeyDraft(e.target.value)}
                                className="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-indigo-500"
                                placeholder="Pega tu API Key aquí" autoComplete="off" />
                            <p className="text-[11px] text-slate-400 mt-2">Se guarda solo en este móvil (localStorage), nunca sale de aquí.</p>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={saveApiKey} className="flex-1 py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-black text-sm transition-all shadow-lg active:scale-95">GUARDAR</button>
                            <button onClick={() => setShowSettings(false)} className="py-3.5 px-4 bg-white/5 hover:bg-white/10 text-slate-400 rounded-xl font-bold text-sm transition-all active:scale-95">CERRAR</button>
                        </div>
                    </div>
                </div>, document.body
            )}

            {/* MODAL CREADOR */}
            {showCreator && ReactDOM.createPortal(
                <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-[70] p-4">
                    <div className="bg-[#0f111a] border border-white/10 p-8 rounded-[2rem] w-full max-w-sm shadow-2xl animate-fade text-center relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-indigo-500 via-purple-500 to-emerald-500"></div>
                        <div className="w-20 h-20 mx-auto bg-white/5 rounded-full flex items-center justify-center mb-6 border border-white/10 shadow-[0_0_30px_rgba(79,70,229,0.2)]">
                            <i className="fa-solid fa-code text-3xl text-indigo-400"></i>
                        </div>
                        <h3 className="text-xl font-black text-white mb-2">El Hilván</h3>
                        <p className="text-sm text-slate-400 mb-6 leading-relaxed">
                            Software de conteo calórico desarrollado y diseñado exclusivamente por <br/>
                            <strong className="text-white">Jonathan Pérez Galán</strong>.<br/><br/>
                            Todos los derechos reservados.
                        </p>
                        <button onClick={() => setShowCreator(false)} className="w-full py-3 bg-white/10 hover:bg-white/20 text-white rounded-xl font-bold text-xs transition-all">CERRAR</button>
                    </div>
                </div>, document.body
            )}

            {/* MODAL GUÍA */}
            {showGuide && ReactDOM.createPortal(
                <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-[70] p-4">
                    <div className="bg-[#0f111a] border border-white/10 rounded-[2rem] w-full max-w-2xl shadow-2xl animate-fade max-h-[85vh] flex flex-col overflow-hidden">
                        <div className="flex justify-between items-center px-6 pt-6 pb-4 border-b border-white/10 shrink-0">
                            <h3 className="text-lg font-black text-white flex items-center gap-2">
                                <i className="fa-solid fa-circle-question text-indigo-400"></i> Guía de Usuario
                            </h3>
                            <button onClick={() => setShowGuide(false)} className="text-slate-400 p-1"><i className="fa-solid fa-xmark text-lg"></i></button>
                        </div>
                        <div className="flex gap-2 px-6 pt-4 flex-wrap shrink-0">
                            {[{ id: 'voz', label: 'Voz', icon: 'fa-microphone' }, { id: 'historial', label: 'Historial', icon: 'fa-clock-rotate-left' }].map(t => (
                                <button key={t.id} onClick={() => setGuideTab(t.id)}
                                    className={`px-4 py-2 rounded-xl text-xs font-black uppercase tracking-widest transition-all flex items-center gap-2 ${guideTab === t.id ? 'bg-indigo-600 text-white' : 'bg-white/5 text-slate-400 hover:bg-white/10'}`}>
                                    <i className={`fa-solid ${t.icon}`}></i> {t.label}
                                </button>
                            ))}
                        </div>
                        <div className="px-6 py-5 overflow-y-auto custom-scrollbar text-sm text-slate-300 leading-relaxed space-y-3">
                            {guideTab === 'voz' && (
                                <>
                                    <h4 className="text-white font-black text-base">Cómo dictar tu comida</h4>
                                    <p>Toca el micrófono grande y describe lo que has comido en una frase natural: <span className="text-white font-bold">"dos huevos fritos con una tostada de pan integral"</span>. La IA estima calorías, proteínas, carbohidratos y grasas automáticamente.</p>
                                    <p><span className="text-white font-bold">Revisión antes de guardar:</span> tras dictar, se abre un formulario con los valores ya rellenos. Puedes corregir cualquier número antes de pulsar GUARDAR — la IA estima, tú tienes la última palabra.</p>
                                    <p><span className="text-white font-bold">Sin voz:</span> pulsa "Añadir manual" para escribir el alimento tú mismo. Dentro del formulario también puedes dictar solo el nombre y luego pulsar "Analizar con IA" para que calcule los macros.</p>
                                    <p>⚡ El reconocimiento de voz y el análisis con IA necesitan conexión a internet.</p>
                                </>
                            )}
                            {guideTab === 'historial' && (
                                <>
                                    <h4 className="text-white font-black text-base">Historial y edición</h4>
                                    <p>Todo lo registrado hoy aparece en "Registrado hoy", con hora y macros. Los días anteriores se resumen en totales por día.</p>
                                    <p><span className="text-white font-bold">Editar o borrar:</span> cada registro tiene un lápiz (editar valores) y una papelera (eliminar) a la derecha.</p>
                                    <p><span className="text-white font-bold">Todo es local:</span> el historial vive en este móvil (localStorage). Si cambias de dispositivo o borras datos del navegador, se pierde — no hay sincronización en la nube.</p>
                                </>
                            )}
                        </div>
                    </div>
                </div>, document.body
            )}
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
