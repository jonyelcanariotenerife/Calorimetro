        pasos: ['Separa el brócoli en arbolitos pequeños y corta la zanahoria en bastones o rodajas finas.', 'Cuece o cocina al vapor el brócoli y la zanahoria 5-6 minutos, hasta que estén tiernos pero con un punto de mordida (al dente).', 'Salpimienta la ternera. Calienta una sartén o plancha a fuego fuerte y sella la carne 2-3 minutos por lado según el grosor.', 'Retira la ternera y déjala reposar 2 minutos tapada con papel de aluminio antes de cortarla en tiras o servirla entera.', 'Escurre bien el brócoli y la zanahoria, salteed rápido en la misma sartén con el aceite y el ajo en polvo, y sirve junto a la carne.'],

        dificultad: 'Fácil',
        pasos: ['Limpia los champiñones con un paño húmedo (evita lavarlos bajo el grifo, absorben agua) y lamínalos.', 'Corta el solomillo en medallones de 2-3 cm de grosor y salpimiéntalos.', 'Calienta la mitad del aceite en una sartén a fuego fuerte y sella los medallones 2 minutos por cada lado. Retíralos y resérvalos.', 'En la misma sartén, añade el resto del aceite y el ajo laminado; en cuanto empiece a dorarse, incorpora los champiñones.', 'Saltea los champiñones 5-6 minutos a fuego medio-alto hasta que suelten el agua y se doren. Si quieres, añade un chorrito de vino blanco y deja que reduzca 1 minuto.', 'Devuelve los medallones a la sartén, mezcla con los champiñones 1-2 minutos para que se calienten juntos, y espolvorea perejil picado antes de servir.'],

//  en Canarias en horario de verano — crítico para turnos de noche.)

    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
};

// ============================================================
// UTILIDADES: Levenshtein y normalización
// ============================================================
function levenshtein(a, b) {
    if (a.length === 0) return b.length;
    if (b.length === 0) return a.length;
    const matrix = [];
    for (let i = 0; i <= b.length; i++) matrix[i] = [i];
    for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
    for (let i = 1; i <= b.length; i++) {
        for (let j = 1; j <= a.length; j++) {
            const cost = a[j-1] === b[i-1] ? 0 : 1;
            matrix[i][j] = Math.min(
                matrix[i-1][j] + 1,
                matrix[i][j-1] + 1,
                matrix[i-1][j-1] + cost
            );
        }
    }
    return matrix[b.length][a.length];
}

function normalizarPalabra(palabra) {
    let p = palabra.toLowerCase().trim();
    p = p.replace(/[áäàâ]/g, 'a').replace(/[éëèê]/g, 'e').replace(/[íïìî]/g, 'i').replace(/[óöòô]/g, 'o').replace(/[úüùû]/g, 'u');
    if (p.endsWith('es') && p.length > 3) p = p.slice(0, -2);
    else if (p.endsWith('s') && p.length > 2) p = p.slice(0, -1);
    if (p.endsWith('a') || p.endsWith('o')) p = p.slice(0, -1);
    return p;
}

function normalizarParaSugerencias(texto) {
    return texto.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
}

function tokenizar(texto) {
    const palabras = texto.toLowerCase().trim().split(/\s+/);
    const stopwords = ['de', 'la', 'el', 'los', 'las', 'un', 'una', 'unos', 'unas', 'con', 'sin', 'y', 'o', 'u', 'para', 'por', 'en', 'al', 'del', 'a', 'e', 'que', 'como', 'mas', 'pero', 'si', 'no', 'su', 'sus', 'mi', 'mis', 'tu', 'tus'];
    return palabras
        .filter(p => !/^[\d.,]+$/.test(p) && !/^(g|gr|kg|ml|l)$/.test(p) && !stopwords.includes(p))
        .map(normalizarPalabra)
        .filter(p => p.length > 1);
}

function fuzzyMatch(aliasTokens, userTokens) {
    let coincidencias = 0;
    let total = aliasTokens.length;
    for (const at of aliasTokens) {
        let mejorDist = Infinity;
        for (const ut of userTokens) {
            const dist = levenshtein(at, ut);
            if (dist < mejorDist) mejorDist = dist;
        }
        if (mejorDist <= 2 || (at.length > 2 && userTokens.some(u => u.includes(at) || at.includes(u)))) {
            coincidencias++;
        }
    }
    return coincidencias / total;
}

// BÚSQUEDA Y SUGERENCIAS LOCALES
// ============================================================
function getCustomFoods() {
    try {
        const data = localStorage.getItem(CUSTOM_FOODS_KEY);
        return data ? JSON.parse(data) : [];
    } catch { return []; }
}

function saveCustomFood(food) {
    const customs = getCustomFoods();
    if (!customs.some(f => f.nombre.toLowerCase() === food.nombre.toLowerCase())) {
        customs.push(food);
        localStorage.setItem(CUSTOM_FOODS_KEY, JSON.stringify(customs));
    }
}

function saveAllCustomFoods(list) {
    localStorage.setItem(CUSTOM_FOODS_KEY, JSON.stringify(list));
}

const HIDDEN_FOODS_KEY = 'calorimetro_hidden_foods';
function getHiddenFoods() {
    try { const s = localStorage.getItem(HIDDEN_FOODS_KEY); if (s) return JSON.parse(s); } catch (e) {}
    return [];
}
function saveHiddenFoods(list) { localStorage.setItem(HIDDEN_FOODS_KEY, JSON.stringify(list)); }

// Catálogo EFECTIVO: personalizados (con prioridad real) + los de fábrica que no
// estén sobreescritos por uno personalizado con el mismo nombre ni ocultos.
// Todo lo que busca o sugiere alimentos debe pasar por aquí, para que "corregir"
// un alimento de fábrica creando uno personalizado con el mismo nombre SÍ gane.
function getCatalogoEfectivo() {
    const customFoods = getCustomFoods();
    const nombresPersonalizados = new Set(customFoods.map(f => f.nombre.toLowerCase()));
    const ocultos = new Set(getHiddenFoods().map(n => n.toLowerCase()));
    const baseFoods = FOOD_DB.filter(f => !nombresPersonalizados.has(f.nombre.toLowerCase()) && !ocultos.has(f.nombre.toLowerCase()));
    return [...customFoods, ...baseFoods];
}

// Búsqueda real-time ("no pelearse con repollo")
function obtenerSugerenciasLocales(textoUsuario) {
    const db = getCatalogoEfectivo();
    const textoLimpio = normalizarParaSugerencias(textoUsuario);
    if (textoLimpio.length < 2) return [];

    const terminosUsuario = textoLimpio.split(' ');
    const resultados = [];
    const idsAgregados = new Set();

    db.forEach(alimento => {
        const candidatos = [alimento.nombre, ...(alimento.alias || [])];
        let coincidenciaFuerte = false;

        candidatos.forEach(aliasText => {
            if (coincidenciaFuerte) return;
            const palabrasAlias = normalizarParaSugerencias(aliasText).split(' ');

            // Comprobar que CADA palabra del usuario encaje al inicio de ALGUNA palabra del alias
            const matchCompleto = terminosUsuario.every(termUser =>
                palabrasAlias.some(palabra => palabra.startsWith(termUser))
            );

            if (matchCompleto) {
                coincidenciaFuerte = true;
            }
        });

        if (coincidenciaFuerte && !idsAgregados.has(alimento.nombre)) {
            resultados.push(alimento);
            idsAgregados.add(alimento.nombre);
        }
    });
    return resultados.slice(0, 8);
}

function buscarAlimento(textoOriginal) {
    const userTokens = tokenizar(textoOriginal);
    if (userTokens.length === 0) return null;

    let mejor = null;
    let mejorScore = 0;
    const allFoods = getCatalogoEfectivo();

    for (const item of allFoods) {
        const candidatos = [item.nombre, ...(item.alias || [])];
        for (const cand of candidatos) {
            const aliasTokens = tokenizar(cand);
            if (aliasTokens.length === 0) continue;
            const score = fuzzyMatch(aliasTokens, userTokens);
            const lengthBonus = Math.min(cand.length / 20, 0.2);
            const totalScore = score + lengthBonus;
            if (totalScore > mejorScore) {
                mejorScore = totalScore;
                mejor = item;
            }
        }
    }
    if (mejorScore < 0.6) return null;
    return mejor;
}

const extraerGramos = (textoOriginal, item) => {
    const texto = normalizarParaSugerencias(textoOriginal);
    const matchPeso = texto.match(/(\d+(?:[.,]\d+)?)\s*(kg|kilos?|kilogramos?|gr|grs|gramos?|g)\b/);
    if (matchPeso) {
        let cantidad = parseFloat(matchPeso[1].replace(',', '.'));
        if (/kg|kilo/.test(matchPeso[2])) cantidad *= 1000;
        return { gramos: Math.round(cantidad), detectado: true };
    }
    if (item && item.unidad) {
        const matchDigito = texto.match(/(\d+(?:[.,]\d+)?)\s*(unidades?|piezas?)?/);
        const palabras = texto.split(/\s+/);
        let cantidadUnidades = null;
        const NUMERO_PALABRA = { 'un':1,'una':1,'uno':1,'dos':2,'tres':3,'cuatro':4,'cinco':5,'seis':6,'siete':7,'ocho':8,'medio':0.5,'media':0.5 };
        for (const palabra of palabras) {
            if (NUMERO_PALABRA[palabra] !== undefined) { cantidadUnidades = NUMERO_PALABRA[palabra]; break; }
        }
        if (cantidadUnidades === null && matchDigito && matchDigito[1] && !matchPeso) {
            cantidadUnidades = parseFloat(matchDigito[1].replace(',', '.'));
        }
        if (cantidadUnidades) {
            return { gramos: Math.round(item.unidad * cantidadUnidades), detectado: true };
        }
    }
    return { gramos: item && item.unidad ? item.unidad : 100, detectado: false };
};

const calcularMacrosPorPeso = (item, gramos) => {
    const factor = gramos / 100;
    return {
        alimento: item.nombre,
        calorias: Math.round(item.cal * factor),
        proteinas: Math.round(item.prot * factor * 10) / 10,
        carbohidratos: Math.round(item.carb * factor * 10) / 10,
        grasas: Math.round(item.gras * factor * 10) / 10,
        gramos: Math.round(gramos)
    };
};

const saveEntries = (list) => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); } catch(e) {} };
const loadProfile = () => { try { const s = localStorage.getItem(PROFILE_KEY); if (s) return JSON.parse(s); } catch(e) {} return null; };
const saveProfile = (profile) => { try { localStorage.setItem(PROFILE_KEY, JSON.stringify(profile)); } catch(e) {} };
const loadClosedDays = () => { try { const s = localStorage.getItem(CLOSED_DAYS_KEY); if (s) return JSON.parse(s); } catch(e) {} return []; };
const saveClosedDays = (days) => { try { localStorage.setItem(CLOSED_DAYS_KEY, JSON.stringify(days)); } catch(e) {} };
const todayStr = () => fechaLocalStr();
const formatFechaAmigable = (fechaStr) => {
    const hoy = new Date(); hoy.setHours(0,0,0,0);
    const ayer = new Date(hoy); ayer.setDate(ayer.getDate() - 1);
    const fecha = new Date(fechaStr + 'T00:00:00');
    if (fecha.getTime() === hoy.getTime()) return 'Hoy';
    if (fecha.getTime() === ayer.getTime()) return 'Ayer';
    const diffDias = Math.floor((hoy.getTime() - fecha.getTime()) / 86400000);
    if (diffDias < 7 && diffDias >= 0) {
        const dias = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
        return dias[fecha.getDay()];
    }
    return `${fecha.getDate()} ${fecha.toLocaleString('es', { month: 'short' })}`;
};

        const peso = Number(p.peso) || 0;

        let tmb = sexo === 'hombre' ? 10 * peso + 6.25 * altura - 5 * edad + 5 : 10 * peso + 6.25 * altura - 5 * edad - 161;
        const factorActividad = [1.2, 1.375, 1.55, 1.725, 1.9][actividad] || 1.2;
        const get = tmb * factorActividad;
        let objetivo, deficit;
        if (p.modoObjetivo === 'directo') {
            // El usuario dice directamente cuánto quiere comer al día.
            objetivo = Math.max(0, Number(p.objetivoDirecto) || 0);
            deficit = Math.round(get - objetivo);
        } else {
            // Modo clásico: se resta el déficit del mantenimiento calculado.
            deficit = Number(p.deficit) || 0;
            objetivo = Math.max(0, get - deficit);

            analyzeLocal(formData.alimento, formData.peso, 'modal');
            return; // Detenemos el guardado hasta que se calculen los macros o se aprenda el alimento
        }

        let macros = calculatedMacros;
        if (!macros) {
            // Última red de seguridad: si por cualquier motivo no hay macros calculados
            // al editar, mantenemos los valores originales del registro en vez de guardar ceros.
            const original = editingId ? entries.find(en => en.id === editingId) : null;
            macros = original
                ? { calorias: original.calorias, proteinas: original.proteinas, carbohidratos: original.carbohidratos, grasas: original.grasas, gramos: original.gramos }
                : { calorias: 0, proteinas: 0, carbohidratos: 0, grasas: 0, gramos: Number(formData.peso) || 100 };
        }
        const newEntry = {
            id: editingId || Date.now(),
            date: formData.fecha || todayStr(),
            hora: new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }),
            alimento: formData.alimento || 'Alimento',
            calorias: macros.calorias || 0, proteinas: macros.proteinas || 0, carbohidratos: macros.carbohidratos || 0, grasas: macros.grasas || 0, gramos: macros.gramos || Number(formData.peso) || 100,
        };

        if (editingId) {
            setEntries(prev => prev.map(en => en.id === editingId ? newEntry : en));
            setToast('✅ Registro actualizado');
        } else {
            setEntries(prev => [...prev, newEntry]);
            setToast('✅ Registrado');
        }
        handleCloseModal();
    };

    const handleDelete = (id) => { setEntries(prev => prev.filter(en => en.id !== id)); setToast('🗑️ Registro eliminado'); };

    const handleRegistrarPlato = (item) => {
        if (isTodayClosed) { setToast('⚠️ El día de hoy está cerrado'); return; }
        const macros = calcularMacrosPorPeso(item, item.unidad);
        const nuevo = {
            id: Date.now(),
            date: todayStr(),
            hora: new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }),
            alimento: item.nombre,
            calorias: macros.calorias, proteinas: macros.proteinas, carbohidratos: macros.carbohidratos, grasas: macros.grasas, gramos: macros.gramos,
        };
        setEntries(prev => [...prev, nuevo]);
        setToast(`✅ ${item.nombre} registrado`);
        setPlatoDetalle(null);
        setPlatosModalOpen(false);
    };
    const handleClearHistory = () => { if (confirm('¿Borrar todo el historial? No se puede deshacer.')) { setEntries([]); setToast('🗑️ Historial borrado'); } };

    // ============================================================
    //  COPIA DE SEGURIDAD — exportar/importar todo en un JSON
    // ============================================================
    const handleExportarDatos = () => {
        const backup = {
            app: 'Calorímetro', version: 2, exportadoEl: new Date().toISOString(),
            entries, profile, customFoods, hiddenFoods, closedDays,
        };
        const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const fecha = fechaLocalStr();
        a.href = url;
        a.download = `calorimetro-backup-${fecha}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        setToast('✅ Backup descargado');
    };

    const handleImportarClick = () => { importFileRef.current && importFileRef.current.click(); };

    const handleImportarDatos = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            try {
                const data = JSON.parse(ev.target.result);
                if (!data || typeof data !== 'object') throw new Error('Archivo no válido');

                // Historial: se combina por id, sin duplicar, sin perder lo que ya tenías.
                if (Array.isArray(data.entries)) {
                    const idsActuales = new Set(entries.map(en => en.id));
                    const nuevas = data.entries.filter(en => en && !idsActuales.has(en.id));
                    setEntries([...entries, ...nuevas]);
                }
                // Alimentos personalizados: se combinan por nombre (el importado gana en empate).
                if (Array.isArray(data.customFoods)) {
                    const propios = customFoods.filter(f => !data.customFoods.some(imp => imp.nombre.toLowerCase() === f.nombre.toLowerCase()));
                    refreshCustomFoods([...propios, ...data.customFoods]);
                }
                // Ocultos: unión de ambas listas.
                if (Array.isArray(data.hiddenFoods)) {
                    const union = Array.from(new Set([...hiddenFoods, ...data.hiddenFoods]));
                    refreshHiddenFoods(union);
                }
                // Días cerrados: unión.
                if (Array.isArray(data.closedDays)) {
                    const union = Array.from(new Set([...closedDays, ...data.closedDays]));
                    setClosedDays(union);
                }
                // Perfil: pisa el actual solo si confirmas (es un dato "de uno solo", no una lista).
                if (data.profile) {
                    if (confirm('El archivo trae un perfil (edad/peso/objetivo) guardado. ¿Quieres reemplazar tu perfil actual con ese?')) {
                        setProfile(data.profile);
                        saveProfile(data.profile);
                    }
                }
                setToast('✅ Backup importado y combinado con tus datos');
            } catch (err) {
                setToast('⚠️ El archivo no es un backup válido de Calorímetro');
            }
        };
        reader.readAsText(file);
        e.target.value = ''; // permite volver a importar el mismo archivo si hace falta
    };
    const dismissVoiceGuide = () => { setVoiceGuideShown(true); localStorage.setItem(GUIDE_SHOWN_KEY, 'true'); };

    const [profileForm, setProfileForm] = useState({ sexo: 'hombre', edad: 30, altura: 175, peso: 75, actividad: 1, deficit: 500, modoObjetivo: 'deficit', objetivoDirecto: 2000 });
    useEffect(() => { if (profile) setProfileForm(profile); }, [profile]);

    // Vista previa EN VIVO dentro del modal de Perfil: así se ve al instante que
    // cambiar el déficit (o cualquier otro campo) sí mueve el objetivo, antes de guardar.
    const previewObjetivo = useMemo(() => calcularObjetivoDesde(profileForm), [profileForm]);

    const handleSaveProfile = () => {
        // Normalizamos todos los campos a número aquí también (no solo en el onChange)
        // para que el perfil guardado nunca dependa de un valor a medio escribir.
        const perfilLimpio = {
            sexo: profileForm.sexo,
            edad: Number(profileForm.edad) || 30,
            altura: Number(profileForm.altura) || 170,
            peso: Number(profileForm.peso) || 70,
            actividad: Number(profileForm.actividad) || 0,
            deficit: Number(profileForm.deficit) || 0,
            modoObjetivo: profileForm.modoObjetivo || 'deficit',
            objetivoDirecto: Number(profileForm.objetivoDirecto) || 0,
        };
        saveProfile(perfilLimpio); // escritura inmediata a localStorage, no solo vía efecto
        setProfile(perfilLimpio);
        setProfileModalOpen(false);
        const obj = calcularObjetivoDesde(perfilLimpio);
        setToast(`✅ Perfil guardado — objetivo: ${Math.round(obj.objetivo)} kcal/día`);
    };

    const startVoiceRecognition = () => {
        if (!isOnline) { setToast('⚠️ Sin conexión a internet'); return; }
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) { setToast('⚠️ Tu navegador no soporta voz'); return; }
        const rec = new SpeechRecognition(); recognitionRef.current = rec;
        rec.lang = 'es-ES'; rec.continuous = false; rec.interimResults = false; rec.maxAlternatives = 1;
        rec.onstart = () => { setIsListening(true); setToast('🎙️ Escuchando... habla claro'); };
        rec.onerror = (event) => {
            if (event.error === 'not-allowed') setToast('⚠️ Permiso de micrófono denegado');
            else if (event.error === 'no-speech') setToast('⚠️ No te he escuchado, intenta de nuevo');
            else setToast('⚠️ Error: ' + event.error);
            setIsListening(false);
        };
        rec.onend = () => setIsListening(false);
        rec.onresult = (event) => analyzeLocal(event.results[0][0].transcript.trim(), null, 'voice');
        try { rec.start(); } catch (e) { setToast('⚠️ Error al iniciar el micrófono'); }
    };

    const handleCloseDay = () => {
        if (isTodayClosed) return;
        if (todayEntries.length === 0) { setToast('⚠️ No has registrado nada hoy, no hace falta cerrar'); return; }
        if (confirm('¿Cerrar el día de hoy? Ya no podrás añadir más registros a este día.')) { setClosedDays(prev => [...prev, todayKey]); setToast('✅ Día cerrado'); }
    };
    const handleReopenDay = () => {
        if (!isTodayClosed) return;
        if (confirm('¿Reabrir el día de hoy? Podrás añadir más registros.')) { setClosedDays(prev => prev.filter(d => d !== todayKey)); setToast('✅ Día reabierto'); }
    };

    return (
        <div className="space-y-4 animate-fade pb-8">
            {toast && <div className="toast">{toast}</div>}

            {/* MODAL APRENDER ALIMENTO */}
            {pendingCustomFood && ReactDOM.createPortal(
                <div className="confirm-modal">
                    <div className="confirm-box">
                        <h3>⚠️ Alimento no reconocido</h3>
                        <p>No encontré "<strong>{pendingCustomFood.alimento}</strong>". Añade sus valores por cada 100g para que la app se los aprenda.</p>
                        
                        <div className="grid grid-cols-2 gap-3 mb-4">
                            <div>
                                <label className="text-[10px] text-slate-400 font-bold uppercase">Kcal / 100g</label>
                                <input type="number" className="w-full bg-white/5 border border-white/10 rounded-lg p-2 text-white text-sm focus:border-indigo-500 focus:outline-none" placeholder="Ej: 150" value={customForm.cal} onChange={e => setCustomForm({...customForm, cal: e.target.value})} />
                            </div>
                            <div>
                                <label className="text-[10px] text-slate-400 font-bold uppercase">Prot (g)</label>
                                <input type="number" className="w-full bg-white/5 border border-white/10 rounded-lg p-2 text-white text-sm focus:border-indigo-500 focus:outline-none" placeholder="Ej: 20" value={customForm.prot} onChange={e => setCustomForm({...customForm, prot: e.target.value})} />
                            </div>
                            <div>
                                <label className="text-[10px] text-slate-400 font-bold uppercase">Carbos (g)</label>
                                <input type="number" className="w-full bg-white/5 border border-white/10 rounded-lg p-2 text-white text-sm focus:border-indigo-500 focus:outline-none" placeholder="0" value={customForm.carb} onChange={e => setCustomForm({...customForm, carb: e.target.value})} />
                            </div>
                            <div>
                                <label className="text-[10px] text-slate-400 font-bold uppercase">Grasas (g)</label>
                                <input type="number" className="w-full bg-white/5 border border-white/10 rounded-lg p-2 text-white text-sm focus:border-indigo-500 focus:outline-none" placeholder="0" value={customForm.gras} onChange={e => setCustomForm({...customForm, gras: e.target.value})} />
                            </div>
                        </div>

                        <div className="confirm-actions">
                            <button className="btn-confirm" onClick={guardarAlimentoCustom}>Aprender</button>
                            <button className="btn-cancel" onClick={() => setPendingCustomFood(null)}>Cancelar</button>
                        </div>
                    </div>
                </div>, document.body
            )}

            {!voiceGuideShown && ReactDOM.createPortal(
                <div className="modal-overlay bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                    <div className="bg-[#0f111a] border border-white/10 p-8 rounded-[2.5rem] w-full max-w-sm shadow-2xl animate-fade text-center relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-indigo-500 via-purple-500 to-emerald-500"></div>
                        <div className="w-20 h-20 mx-auto bg-indigo-500/10 rounded-full flex items-center justify-center mb-5 border border-indigo-500/20">
                            <i className="fa-solid fa-microphone text-4xl text-indigo-400"></i>
                        </div>
                        <h3 className="text-xl font-black text-white mb-2">🎙️ Dicta lo que comes</h3>
                        <p className="text-sm text-slate-400 mb-4">Sin escribir, solo habla</p>
                        <div className="bg-black/40 p-4 rounded-2xl border border-white/5 text-left space-y-3 mb-6">
                            <div className="flex items-center gap-3"><span className="text-indigo-400 text-sm">💬</span><span className="text-slate-300 text-sm">"dos huevos fritos con pan"</span></div>
                            <div className="flex items-center gap-3"><span className="text-indigo-400 text-sm">💬</span><span className="text-slate-300 text-sm">"un plátano y un café con leche"</span></div>
                            <div className="flex items-center gap-3"><span className="text-indigo-400 text-sm">💬</span><span className="text-slate-300 text-sm">"pechuga de pollo con arroz"</span></div>
                        </div>
                        <div className="text-xs text-slate-400 space-y-2 text-left mb-6">
                            <p>📌 Busca el alimento en la base de datos y calcula los macros por el peso</p>
                            <p>🔄 Puedes corregir cualquier valor antes de guardar</p>
                            <p>⚡ El micrófono necesita conexión a internet, el cálculo no</p>
                        </div>
                        <button onClick={dismissVoiceGuide} className="w-full py-4 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-black text-sm transition-all shadow-lg active:scale-95">
                            ENTENDIDO
                        </button>
                    </div>
                </div>, document.body
            )}

            {/* HEADER */}
            <div className="bg-white/5 border border-white/10 p-4 rounded-2xl backdrop-blur-md">
                <div className="flex justify-between items-start gap-2">
                    <div className="min-w-0">
                        <div className="flex items-center gap-2 flex-wrap">
                            <h1 className="text-lg font-black text-white tracking-tight">Calorímetro</h1>
                            <span className={`text-[12px] font-bold px-2 py-1 rounded-full ${todayTotals.kcal > 0 ? 'bg-indigo-500/20 text-indigo-300 border border-indigo-500/20' : 'bg-white/5 text-slate-400'}`}>
                                Hoy: {Math.round(todayTotals.kcal)} kcal
                            </span>
                            {isTodayClosed && <span className="day-closed-badge">🔒 Cerrado</span>}
                        </div>
                        <p className="text-[12px] text-slate-400 uppercase tracking-widest mt-0.5">
                            {isOnline ? 'Listo para escuchar' : 'Sin conexión'}
                        </p>
                    </div>
                    <button onClick={toggleTheme} className="theme-toggle shrink-0" title="Cambiar tema"><i className={`fa-solid ${theme === 'dark' ? 'fa-sun' : 'fa-moon'}`}></i></button>
                </div>
                <div className="grid grid-cols-4 gap-1.5 mt-3 pt-3 border-t border-white/5">
                    <button onClick={() => setPlatosModalOpen(true)} className="flex flex-col items-center gap-1 py-2 rounded-xl text-slate-300 hover:bg-white/5 hover:text-white transition-colors" title="Platos combinados">
                        <i className="fa-solid fa-utensils text-sm"></i>
                        <span className="text-[9px] font-bold uppercase tracking-wide">Platos</span>
                    </button>
                    <button onClick={() => setManageFoodsOpen(true)} className="flex flex-col items-center gap-1 py-2 rounded-xl text-slate-300 hover:bg-white/5 hover:text-white transition-colors" title="Mis alimentos">
                        <i className="fa-solid fa-database text-sm"></i>
                        <span className="text-[9px] font-bold uppercase tracking-wide">Alimentos</span>
                    </button>
                    <button onClick={() => setProfileModalOpen(true)} className="flex flex-col items-center gap-1 py-2 rounded-xl text-slate-300 hover:bg-white/5 hover:text-white transition-colors" title="Perfil">
                        <i className="fa-solid fa-user text-sm"></i>
                        <span className="text-[9px] font-bold uppercase tracking-wide">Perfil</span>
                    </button>
                    <button onClick={() => setBackupModalOpen(true)} className="flex flex-col items-center gap-1 py-2 rounded-xl text-slate-300 hover:bg-white/5 hover:text-white transition-colors" title="Copia de seguridad">
                        <i className="fa-solid fa-cloud-arrow-down text-sm"></i>
                        <span className="text-[9px] font-bold uppercase tracking-wide">Backup</span>
                    </button>
                </div>
            </div>

            {/* RESUMEN PROGRESO */}
            {calcularObjetivo && !isTodayClosed ? (
                <div className="bg-white/5 border border-white/10 rounded-3xl p-5 space-y-3">
                    <div className="flex justify-between items-center">
                        <span className="text-sm font-bold text-white">🎯 Objetivo diario</span>
                        <span className="text-sm font-black text-indigo-400">{Math.round(calcularObjetivo.objetivo)} kcal</span>
                    </div>
                    <div className="flex justify-between items-center text-sm">
                        <span className="text-slate-400">Consumido: <strong className="text-white">{Math.round(todayTotals.kcal)} kcal</strong></span>
                        <span className={`font-bold ${progreso.restante >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                            {progreso.restante >= 0 ? `Restan ${progreso.restante} kcal` : `Exceso ${Math.abs(progreso.restante)} kcal`}
                        </span>
                    </div>
                    <div className="progress-bar"><div className={`progress-fill bg-${progreso.color}-500`} style={{ width: `${Math.min(progreso.porcentaje, 100)}%` }}></div></div>
                    <div className="flex justify-between text-xs font-bold uppercase tracking-wider">
                        <span className="text-emerald-400">Déficit</span><span className="text-amber-400">Equilibrio</span><span className="text-rose-400">Superávit</span>
                    </div>
                    <div className="flex justify-between items-center text-sm pt-1">
                        <span className="text-slate-400">Estado:</span>
                        <span className={`font-black ${progreso.estado === 'deficit' ? 'text-emerald-400' : progreso.estado === 'equilibrio' ? 'text-amber-400' : 'text-rose-400'}`}>
                            {progreso.estado === 'deficit' && '✅ En déficit (puedes comer más)'}
                            {progreso.estado === 'equilibrio' && '⚠️ En el límite (cuidado)'}
                            {progreso.estado === 'superavit' && '🔴 Has superado el objetivo'}
                            {progreso.estado === 'sin_objetivo' && 'Objetivo no definido'}
                        </span>
                    </div>
                    <div className="grid grid-cols-3 gap-2 mt-2 pt-2 border-t border-white/5">
                        <div className="text-center">
                            <div className="text-emerald-400 font-black text-sm">{Math.round(todayTotals.prot)}g</div>
                            <div className="text-[10px] text-slate-400 uppercase tracking-wider font-bold">Proteína</div>
                        </div>
                        <div className="text-center">
                            <div className="text-amber-400 font-black text-sm">{Math.round(todayTotals.carb)}g</div>
                            <div className="text-[10px] text-slate-400 uppercase tracking-wider font-bold">Carbos</div>
                        </div>
                        <div className="text-center">
                            <div className="text-rose-400 font-black text-sm">{Math.round(todayTotals.fat)}g</div>
                            <div className="text-[10px] text-slate-400 uppercase tracking-wider font-bold">Grasa</div>
                        </div>
                    </div>
                </div>
            ) : (
                <div className="bg-white/5 border border-white/10 rounded-3xl p-5 text-center">
                    <p className="text-sm text-slate-400">{isTodayClosed ? '🔒 Día cerrado' : 'Configura tu perfil para ver tu objetivo'}</p>
                    {!isTodayClosed && <button onClick={() => setProfileModalOpen(true)} className="mt-2 text-indigo-400 font-bold text-sm hover:underline">Ir a perfil</button>}
                </div>
            )}

            {/* BOTÓN VOZ */}
            <div className="flex flex-col items-center gap-3 py-2">
                <button
                    onClick={startVoiceRecognition} disabled={!isOnline || isTodayClosed}
                    className={`mic-hero w-24 h-24 rounded-full flex items-center justify-center text-3xl shadow-2xl border ${isListening ? 'active bg-rose-500/30 border-rose-500/50 text-rose-400' : isOnline && !isTodayClosed ? 'bg-indigo-600 border-indigo-400/30 text-white hover:bg-indigo-500' : 'bg-slate-700/50 border-slate-600/30 text-slate-400 cursor-not-allowed'}`}
                >
                    <i className={`fa-solid ${isListening ? 'fa-circle-stop' : 'fa-microphone'}`}></i>
                </button>
                <p className="text-xs text-slate-400 font-bold uppercase tracking-widest">{isTodayClosed ? 'Día cerrado' : (isListening ? 'Escuchando...' : 'Toca y describe qué comiste')}</p>
                <button onClick={handleOpenAdd} disabled={isTodayClosed} className="text-[12px] font-bold text-indigo-400 hover:text-indigo-300 flex items-center gap-1.5 disabled:opacity-50"><i className="fa-solid fa-plus"></i> Añadir manual</button>
            </div>

            {/* HISTORIAL HOY */}
            <div className="bg-white/5 border border-white/10 rounded-3xl p-5">
                <h3 className="text-xs font-black text-slate-400 uppercase tracking-wider mb-3">Registrado hoy {isTodayClosed && ' (cerrado)'}</h3>
                <div className="space-y-2 max-h-72 overflow-y-auto custom-scrollbar pr-1">
                    {todayEntries.length === 0 && <p className="text-slate-400 text-xs text-center py-4">Aún no has registrado nada hoy.</p>}
                    {todayEntries.map((entry, idx) => (
                        <div key={entry.id} className="entry-enter p-3 rounded-xl bg-black/40 border border-white/5 text-xs" style={{ animationDelay: `${idx * 0.05}s` }}>
                            <div className="flex justify-between items-center">
                                <div>
                                    <p className="font-bold text-white">{entry.alimento}</p>
                                    <p className="text-[12px] text-slate-400 mt-0.5">{entry.hora} · {Math.round(entry.proteinas)}p / {Math.round(entry.carbohidratos)}c / {Math.round(entry.grasas)}g</p>
                                </div>
                                <div className="flex items-center gap-3">
                                    <span className="font-black text-indigo-400">{Math.round(entry.calorias)} kcal</span>
                                    {!isTodayClosed && (
                                        <div className="flex gap-1">
                                            <button onClick={() => handleOpenEdit(entry)} className="text-slate-400 hover:text-indigo-400 p-1"><i className="fa-solid fa-pen text-xs"></i></button>
                                            <button onClick={() => handleDelete(entry.id)} className="text-slate-400 hover:text-rose-400 p-1"><i className="fa-solid fa-trash text-xs"></i></button>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    ))}
                </div>
                {!isTodayClosed && todayEntries.length > 0 && <button onClick={handleCloseDay} className="mt-4 w-full py-3 bg-amber-500/20 hover:bg-amber-500/30 text-amber-400 border border-amber-500/30 rounded-xl font-bold text-xs transition-all active:scale-95">✅ Cerrar día / Ya no como más</button>}
                {isTodayClosed && <button onClick={handleReopenDay} className="mt-4 w-full py-3 bg-indigo-500/20 hover:bg-indigo-500/30 text-indigo-400 border border-indigo-500/30 rounded-xl font-bold text-xs transition-all active:scale-95">🔓 Reabrir día</button>}
            </div>

            {/* DÍAS ANTERIORES */}
            <div className="bg-white/5 border border-white/10 rounded-3xl p-5">
                <div className="flex justify-between items-center mb-3">
                    <h3 className="text-xs font-black text-slate-400 uppercase tracking-wider">Días anteriores</h3>
                    {pastDays.length > 0 && <button onClick={handleClearHistory} className="text-[11px] font-bold text-rose-400 hover:text-rose-300">Borrar historial</button>}
                </div>
                <div className="space-y-2">
                    {pastDays.length === 0 && <p className="text-slate-400 text-xs text-center py-2">Sin registros anteriores.</p>}
                    {pastDays.map(d => (
                        <div key={d.date} className="flex justify-between items-center px-3 py-2.5 rounded-xl bg-black/30 text-xs">
                            <span className="text-slate-300 font-semibold">{formatFechaAmigable(d.date)}</span>
                            <span className="text-indigo-400 font-black">{Math.round(d.kcal)} kcal</span>
                        </div>
                    ))}
                </div>
            </div>

            {/* PIE */}
            <div className="mt-2 flex justify-center pb-2">

                                <div>
                                    <label className="text-[12px] font-bold text-slate-400 uppercase tracking-widest mb-1 block">Ración típica (g)</label>
                                    <input type="number" inputMode="numeric" value={foodForm.unidad} onChange={e => setFoodForm({ ...foodForm, unidad: e.target.value })}
                                        className="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-indigo-500" placeholder="100" />
                                </div>
                            </div>
                            <div className="grid grid-cols-3 gap-3">
                                <div>
                                    <label className="text-[11px] font-bold text-emerald-400 uppercase tracking-widest mb-1 block">Prot. /100g</label>
                                    <input type="number" inputMode="numeric" value={foodForm.prot} onChange={e => setFoodForm({ ...foodForm, prot: e.target.value })}
                                        className="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-emerald-500" placeholder="0" />
                                </div>
                                <div>
                                    <label className="text-[11px] font-bold text-amber-400 uppercase tracking-widest mb-1 block">Carb. /100g</label>
                                    <input type="number" inputMode="numeric" value={foodForm.carb} onChange={e => setFoodForm({ ...foodForm, carb: e.target.value })}
                                        className="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-amber-500" placeholder="0" />
                                </div>
                                <div>
                                    <label className="text-[11px] font-bold text-rose-400 uppercase tracking-widest mb-1 block">Grasa /100g</label>
                                    <input type="number" inputMode="numeric" value={foodForm.gras} onChange={e => setFoodForm({ ...foodForm, gras: e.target.value })}
                                        className="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-rose-500" placeholder="0" />
                                </div>
                            </div>
                            <div>
                                <label className="text-[12px] font-bold text-slate-400 uppercase tracking-widest mb-1 block">Receta / notas (opcional)</label>
                                <textarea value={foodForm.receta} onChange={e => setFoodForm({ ...foodForm, receta: e.target.value })} rows="3"
                                    className="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-indigo-500 resize-none"
                                    placeholder="Ej: 150g pechuga, 100g arroz, 1 cda aceite. Plancha 5 min por lado..."></textarea>
                            </div>
                            <div className="flex gap-2 mt-2">
                                <button type="submit" className="flex-1 py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-black text-sm transition-all shadow-lg active:scale-95">
                                    {foodEditingOriginal ? 'ACTUALIZAR' : 'GUARDAR'}
                                </button>
                                <button type="button" onClick={() => setFoodFormOpen(false)} className="py-3.5 px-4 bg-white/5 hover:bg-white/10 text-slate-400 rounded-xl font-bold text-sm transition-all active:scale-95">CANCELAR</button>
                            </div>
                        </form>
                    </div>
                </div>, document.body
            )}

            {/* MODAL PLATOS COMBINADOS — listado único, con foto cuando la haya y filtro opcional */}
            {platosModalOpen && ReactDOM.createPortal(
                <div className="modal-overlay bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center z-50 p-0 sm:p-4">
                    <div className="bg-[#0f111a] border border-white/10 p-6 rounded-t-[2.5rem] sm:rounded-[2rem] w-full max-w-md shadow-2xl animate-fade max-h-[85vh] flex flex-col">
                        <div className="flex justify-between items-center mb-1 shrink-0">
                            <h3 className="text-base font-black text-white">🍽️ Platos combinados</h3>
                            <button onClick={() => setPlatosModalOpen(false)} className="text-slate-400 hover:text-white transition-colors p-1"><i className="fa-solid fa-xmark text-lg"></i></button>
                        </div>
                        <p className="text-[11px] text-slate-400 mb-3 shrink-0">Toca un plato para ver su receta, ingredientes y calorías.</p>
                        <div className="flex gap-1.5 mb-3 shrink-0 overflow-x-auto custom-scrollbar pb-1">
                            {TIPOS_PLATO.map(t => (
                                <button key={t} onClick={() => setFiltroTipoPlato(t)}
                                    className={`shrink-0 px-3.5 py-1.5 rounded-full text-[11px] font-black uppercase tracking-widest transition-all ${filtroTipoPlato === t ? 'bg-indigo-600 text-white' : 'bg-white/5 text-slate-400'}`}>
                                    {t}
                                </button>
                            ))}
                        </div>
                        <div className="space-y-2 overflow-y-auto custom-scrollbar pr-1">
                            {platosFiltrados.map(item => {
                                const imagen = RECIPES[item.nombre] && RECIPES[item.nombre].imagen;
                                return (
                                    <button key={item.nombre} onClick={() => setPlatoDetalle(item)} className="w-full text-left rounded-xl bg-black/40 border border-white/5 overflow-hidden hover:border-indigo-500/30 transition-colors">
                                        <div className="flex items-center">
                                            {imagen && (
                                                <img src={imagen} alt={item.nombre} loading="lazy"
                                                    onError={(e) => { e.target.style.display = 'none'; }}
                                                    className="w-16 h-16 object-cover shrink-0 bg-white/5" />
                                            )}
                                            <div className="p-3 flex-1 min-w-0 text-xs">
                                                <div className="flex justify-between items-center gap-2">
                                                    <p className="font-bold text-white truncate">{item.nombre}</p>
                                                    <span className="font-black text-indigo-400 whitespace-nowrap shrink-0">{Math.round(item.cal * item.unidad / 100)} kcal</span>
                                                </div>
                                                <p className="text-[10px] text-slate-400 mt-0.5">Ración: {item.unidad}g{RECIPES[item.nombre].tipo ? ' · ' + RECIPES[item.nombre].tipo : ''}{RECIPES[item.nombre].precio ? ' · ~' + RECIPES[item.nombre].precio.toFixed(2) + '€' : ''}</p>
                                            </div>
                                        </div>
                                    </button>
                                );
                            })}
                        </div>
                    </div>
                </div>, document.body
            )}

            {/* MODAL PLATOS COMBINADOS — detalle con receta */}
            {platoDetalle && ReactDOM.createPortal(
                <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center z-[80] p-0 sm:p-4">
                    <div className="bg-[#0f111a] border border-white/10 rounded-t-[2.5rem] sm:rounded-[2rem] w-full max-w-sm shadow-2xl animate-fade max-h-[85vh] flex flex-col overflow-hidden">
                        {RECIPES[platoDetalle.nombre] && RECIPES[platoDetalle.nombre].imagen && (
                            <div className="relative w-full h-40 shrink-0 bg-white/5">
                                <img src={RECIPES[platoDetalle.nombre].imagen} alt={platoDetalle.nombre} loading="lazy"
                                    onError={(e) => { e.target.style.display = 'none'; }}
                                    className="w-full h-full object-cover" />
                                <button onClick={() => setPlatoDetalle(null)} className="absolute top-3 right-3 w-8 h-8 rounded-full bg-black/60 backdrop-blur-sm text-white flex items-center justify-center"><i className="fa-solid fa-xmark"></i></button>
                            </div>
                        )}
                        <div className="p-6 overflow-y-auto custom-scrollbar space-y-4">
                            <div className="flex justify-between items-center -mt-1 shrink-0">
                                <h3 className="text-base font-black text-white pr-2">{platoDetalle.nombre}</h3>
                                {!(RECIPES[platoDetalle.nombre] && RECIPES[platoDetalle.nombre].imagen) && (
                                    <button onClick={() => setPlatoDetalle(null)} className="text-slate-400 hover:text-white transition-colors p-1 shrink-0"><i className="fa-solid fa-xmark text-lg"></i></button>
                                )}
                            </div>
                            <div className="grid grid-cols-4 gap-2">
                                <div className="bg-black/40 rounded-xl p-2 text-center"><div className="font-black text-indigo-400 text-sm">{Math.round(platoDetalle.cal * platoDetalle.unidad / 100)}</div><div className="text-[9px] text-slate-400 uppercase">kcal</div></div>
                                <div className="bg-emerald-500/10 border border-emerald-500/20 rounded-xl p-2 text-center"><div className="font-black text-emerald-400 text-sm">{Math.round(platoDetalle.prot * platoDetalle.unidad / 100)}g</div><div className="text-[9px] text-slate-400 uppercase">Prot</div></div>
                                <div className="bg-amber-500/10 border border-amber-500/20 rounded-xl p-2 text-center"><div className="font-black text-amber-400 text-sm">{Math.round(platoDetalle.carb * platoDetalle.unidad / 100)}g</div><div className="text-[9px] text-slate-400 uppercase">Carb</div></div>
                                <div className="bg-rose-500/10 border border-rose-500/20 rounded-xl p-2 text-center"><div className="font-black text-rose-400 text-sm">{Math.round(platoDetalle.gras * platoDetalle.unidad / 100)}g</div><div className="text-[9px] text-slate-400 uppercase">Grasa</div></div>
                            </div>
                            <p className="text-[10px] text-slate-400 -mt-2">Para una ración de {platoDetalle.unidad}g. Los valores por 100g están en el catálogo.</p>

                            {RECIPES[platoDetalle.nombre] && RECIPES[platoDetalle.nombre].notaSalud && (
                                <p className="text-[11px] text-emerald-300 bg-emerald-500/10 border border-emerald-500/20 rounded-lg px-3 py-2">🩺 {RECIPES[platoDetalle.nombre].notaSalud}</p>
                            )}

                            {RECIPES[platoDetalle.nombre] && (
                                <>
                                    <div className="flex gap-2 flex-wrap">
                                        <span className="text-[10px] font-bold bg-white/5 border border-white/10 rounded-full px-3 py-1.5 text-slate-300"><i className="fa-regular fa-clock mr-1"></i>Prep: {RECIPES[platoDetalle.nombre].tiempoPrep}</span>
                                        <span className="text-[10px] font-bold bg-white/5 border border-white/10 rounded-full px-3 py-1.5 text-slate-300"><i className="fa-solid fa-fire mr-1"></i>Cocción: {RECIPES[platoDetalle.nombre].tiempoCoccion}</span>
                                        <span className="text-[10px] font-bold bg-white/5 border border-white/10 rounded-full px-3 py-1.5 text-slate-300"><i className="fa-solid fa-gauge mr-1"></i>{RECIPES[platoDetalle.nombre].dificultad}</span>
                                        {RECIPES[platoDetalle.nombre].precio > 0 && (
                                            <span className="text-[10px] font-bold bg-emerald-500/10 border border-emerald-500/20 rounded-full px-3 py-1.5 text-emerald-300"><i className="fa-solid fa-euro-sign mr-1"></i>~{RECIPES[platoDetalle.nombre].precio.toFixed(2)}€ aprox.</span>
                                        )}
                                    </div>

                                    <div>
                                        <h4 className="text-[12px] font-bold text-slate-400 uppercase tracking-widest mb-2">Ingredientes (para {platoDetalle.unidad}g de ración)</h4>
                                        <div className="space-y-1.5">
                                            {RECIPES[platoDetalle.nombre].ingredientes.map((ing, i) => (
                                                <div key={i} className="flex justify-between text-xs bg-black/30 rounded-lg px-3 py-2">
                                                    <span className="text-slate-300">{ing.nombre}</span>
                                                    <span className="text-white font-bold">{ing.gramos} g</span>
                                                </div>
                                            ))}
                                        </div>
                                        {RECIPES[platoDetalle.nombre].extras && RECIPES[platoDetalle.nombre].extras.length > 0 && (
                                            <p className="text-[10px] text-slate-400 mt-2">+ al gusto: {RECIPES[platoDetalle.nombre].extras.join(', ')} <span className="italic">(no suman calorías apreciables)</span></p>
                                        )}
                                    </div>

                                    <div>
                                        <h4 className="text-[12px] font-bold text-slate-400 uppercase tracking-widest mb-2">Elaboración</h4>
                                        <ol className="space-y-2.5">
                                            {RECIPES[platoDetalle.nombre].pasos.map((paso, i) => (
                                                <li key={i} className="flex gap-2.5 text-xs text-slate-300 leading-relaxed">
                                                    <span className="shrink-0 w-5 h-5 rounded-full bg-indigo-500/20 border border-indigo-500/30 text-indigo-400 font-black flex items-center justify-center text-[10px]">{i + 1}</span>
                                                    <span>{paso}</span>
                                                </li>
                                            ))}
                                        </ol>
                                    </div>

                                    {RECIPES[platoDetalle.nombre].consejo && (
                                        <p className="text-[11px] text-amber-300 bg-amber-500/10 border border-amber-500/20 rounded-lg px-3 py-2">💡 {RECIPES[platoDetalle.nombre].consejo}</p>
                                    )}

                                    <p className="text-[10px] text-slate-400">📌 Receta orientativa para acercarte a las calorías del plato — ajusta cantidades a tu gusto.</p>
                                </>
                            )}

                            <button onClick={() => handleRegistrarPlato(platoDetalle)} className="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-black text-sm transition-all shadow-lg active:scale-95">
                                REGISTRAR ESTE PLATO
                            </button>
                        </div>
                    </div>
                </div>, document.body
            )}

            {/* MODAL CREADOR & GUIA (Resto de modales base iguales...) */}
            {showCreator && ReactDOM.createPortal(
                <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-[70] p-4">
                    <div className="bg-[#0f111a] border border-white/10 p-8 rounded-[2rem] w-full max-w-sm shadow-2xl animate-fade text-center relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-indigo-500 via-purple-500 to-emerald-500"></div>
                        <div className="w-20 h-20 mx-auto rounded-full flex items-center justify-center mb-4 shadow-[0_0_35px_rgba(99,102,241,0.35)]" style={{ background: 'linear-gradient(135deg, #6366f1 0%, #a855f7 55%, #10b981 100%)' }}>
                            <svg viewBox="0 0 24 24" className="w-10 h-10" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 2c-.6 2.4-2.2 3.7-3.5 5.2C7 9 6 10.7 6 13a6 6 0 0 0 12 0c0-2.6-1.4-4.4-2.6-6-.4.9-1 1.7-1.8 2.1.2-2.6-.6-4.8-1.6-7.1Z" fill="white"/><path d="M12 20a4 4 0 0 1-4-4c0-1.4.7-2.3 1.5-3.2.2 1 .8 1.7 1.6 2 0-1.3.4-2.3 1-3.3.7 1.1 1.9 2 1.9 3.5a4 4 0 0 1-2 4Z" fill="#0f111a" opacity="0.55"/></svg>
                        </div>
                        <h3 className="text-xl font-black text-white mb-2">Calorímetro</h3>
                        <p className="text-sm text-slate-400 mb-6 leading-relaxed">Software de conteo calórico desarrollado y diseñado exclusivamente por <br/><strong className="text-white">Jonathan Pérez Galán</strong>.<br/><br/>Todos los derechos reservados.</p>
                        <button onClick={() => setShowCreator(false)} className="w-full py-3 bg-white/10 hover:bg-white/20 text-white rounded-xl font-bold text-xs transition-all">CERRAR</button>
                    </div>
                </div>, document.body
            )}

            {showGuide && ReactDOM.createPortal(
                <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-[70] p-4">
                    <div className="bg-[#0f111a] border border-white/10 rounded-[2rem] w-full max-w-2xl shadow-2xl animate-fade max-h-[85vh] flex flex-col overflow-hidden">
                        <div className="flex justify-between items-center px-6 pt-6 pb-4 border-b border-white/10 shrink-0">
                            <h3 className="text-lg font-black text-white flex items-center gap-2"><i className="fa-solid fa-circle-question text-indigo-400"></i> Guía de Usuario</h3>
                            <button onClick={() => setShowGuide(false)} className="text-slate-400 p-1"><i className="fa-solid fa-xmark text-lg"></i></button>
                        </div>
                        <div className="flex gap-2 px-6 pt-4 flex-wrap shrink-0">
                            {[{ id: 'voz', label: 'Voz', icon: 'fa-microphone' }, { id: 'historial', label: 'Historial', icon: 'fa-clock-rotate-left' }, { id: 'perfil', label: 'Perfil', icon: 'fa-user' }, { id: 'alimentos', label: 'Alimentos', icon: 'fa-database' }].map(t => (
                                <button key={t.id} onClick={() => setGuideTab(t.id)} className={`px-4 py-2 rounded-xl text-xs font-black uppercase tracking-widest transition-all flex items-center gap-2 ${guideTab === t.id ? 'bg-indigo-600 text-white' : 'bg-white/5 text-slate-400 hover:bg-white/10'}`}><i className={`fa-solid ${t.icon}`}></i> {t.label}</button>
                            ))}
                        </div>
                        <div className="px-6 py-5 overflow-y-auto custom-scrollbar text-sm text-slate-300 leading-relaxed space-y-3">
                            {guideTab === 'voz' && (<><h4 className="text-white font-black text-base">Cómo dictar tu comida</h4><p>Toca el micrófono grande y describe lo que has comido, indicando a ser posible la cantidad: <span className="text-white font-bold">"200 gramos de pechuga de pollo"</span> o <span className="text-white font-bold">"dos huevos fritos"</span>. La app busca el alimento en su base de datos local y calcula calorías, proteínas, carbohidratos y grasas según el peso.</p><p><span className="text-white font-bold">Ajustar el peso:</span> tras dictar, se abre un formulario con el alimento y el peso detectado. Si cambias el peso, los macros se recalculan solos al momento.</p><p><span className="text-white font-bold">Sin voz:</span> pulsa "Añadir manual" para escribir el alimento tú mismo, indica el peso y pulsa "Buscar en la base de datos" para que calcule los macros.</p><p><span className="text-white font-bold">Si no lo encuentra:</span> te preguntará si quieres guardar con 0 calorías. Puedes editarlo después.</p><p>⚡ El reconocimiento de voz necesita conexión a internet, pero la búsqueda y el cálculo de macros funcionan siempre, sin conexión.</p></>)}
                            {guideTab === 'historial' && (<><h4 className="text-white font-black text-base">Historial y edición</h4><p>Todo lo registrado hoy aparece en "Registrado hoy", con hora y macros. Los días anteriores se resumen en totales por día.</p><p><span className="text-white font-bold">Editar o borrar:</span> cada registro tiene un lápiz (editar) y una papelera (eliminar) a la derecha.</p><p><span className="text-white font-bold">Cerrar día:</span> cuando hayas terminado de comer, pulsa "Cerrar día" para archivar el día. Ya no podrás añadir más registros a ese día. Puedes reabrirlo si lo necesitas.</p><p><span className="text-white font-bold">Todo es local:</span> el historial vive en este móvil (localStorage). Si cambias de dispositivo o borras datos del navegador, se pierde — no hay sincronización en la nube.</p></>)}
                            {guideTab === 'perfil' && (<><h4 className="text-white font-black text-base">Perfil y objetivo</h4><p>Configura tu perfil (sexo, edad, altura, peso, actividad y déficit) para que la app calcule tu objetivo calórico diario.</p><p>El <span className="text-white font-bold">objetivo</span> es el número de calorías que debes consumir para estar en déficit y perder peso.</p><p>La barra de progreso te muestra en tiempo real cómo vas: <span className="text-emerald-400">verde</span> (déficit), <span className="text-amber-400">naranja</span> (en el límite) o <span className="text-rose-400">rojo</span> (superávit).</p><p>También se muestran los totales de proteínas, carbohidratos y grasas del día.</p></>)}
                            {guideTab === 'alimentos' && (<><h4 className="text-white font-black text-base">Mis alimentos</h4><p>El icono <i className="fa-solid fa-database text-indigo-400"></i> del header abre tu propia base de datos personal, aparte del catálogo de fábrica.</p><p><span className="text-white font-bold">Crear:</span> pulsa "Nuevo alimento" y rellena nombre, calorías/proteínas/carbohidratos/grasas por cada 100g, y la ración típica en gramos.</p><p><span className="text-white font-bold">Editar o borrar:</span> cada alimento de tu lista tiene lápiz y papelera. Si creas uno con el mismo nombre que uno del catálogo base, el tuyo tiene prioridad — así puedes "corregir" un valor sin depender de que falle la búsqueda primero.</p><p><span className="text-white font-bold">Alias:</span> añade formas alternativas de decirlo (separadas por coma) para que la voz lo reconozca aunque lo digas distinto.</p></>)}
                        </div>
                    </div>
                </div>, document.body
            )}
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
