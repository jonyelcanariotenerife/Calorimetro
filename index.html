// ============================================================
// UTILIDADES: Levenshtein y normalización
// ============================================================
function levenshtein(a, b) {
    if (a.length === 0) return b.length;
    if (b.length === 0) return a.length;
    const matrix = [];
    for (let i = 0; i <= b.length; i++) matrix[i] = [i];
    for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
    for (let i = 1; i <= b.length; i++) {
        for (let j = 1; j <= a.length; j++) {
            const cost = a[j-1] === b[i-1] ? 0 : 1;
            matrix[i][j] = Math.min(
                matrix[i-1][j] + 1,
                matrix[i][j-1] + 1,
                matrix[i-1][j-1] + cost
            );
        }
    }
    return matrix[b.length][a.length];
}

function normalizarPalabra(palabra) {
    let p = palabra.toLowerCase().trim();
    p = p.replace(/[áäàâ]/g, 'a').replace(/[éëèê]/g, 'e').replace(/[íïìî]/g, 'i').replace(/[óöòô]/g, 'o').replace(/[úüùû]/g, 'u');
    if (p.endsWith('es') && p.length > 3) p = p.slice(0, -2);
    else if (p.endsWith('s') && p.length > 2) p = p.slice(0, -1);
    if (p.endsWith('a') || p.endsWith('o')) p = p.slice(0, -1);
    return p;
}

function normalizarParaSugerencias(texto) {
    return texto.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
}

function tokenizar(texto) {
    const palabras = texto.toLowerCase().trim().split(/\s+/);
    const stopwords = ['de', 'la', 'el', 'los', 'las', 'un', 'una', 'unos', 'unas', 'con', 'sin', 'y', 'o', 'u', 'para', 'por', 'en', 'al', 'del', 'a', 'e', 'que', 'como', 'mas', 'pero', 'si', 'no', 'su', 'sus', 'mi', 'mis', 'tu', 'tus'];
    return palabras
        .filter(p => !/^[\d.,]+$/.test(p) && !/^(g|gr|kg|ml|l)$/.test(p) && !stopwords.includes(p))
        .map(normalizarPalabra)
        .filter(p => p.length > 1);
}

function fuzzyMatch(aliasTokens, userTokens) {
    let coincidencias = 0;
    let total = aliasTokens.length;
    for (const at of aliasTokens) {
        let mejorDist = Infinity;
        for (const ut of userTokens) {
            const dist = levenshtein(at, ut);
            if (dist < mejorDist) mejorDist = dist;
        }
        if (mejorDist <= 2 || (at.length > 2 && userTokens.some(u => u.includes(at) || at.includes(u)))) {
            coincidencias++;
        }
    }
    return coincidencias / total;
}

// ============================================================
// BÚSQUEDA Y SUGERENCIAS LOCALES
// ============================================================
function obtenerSugerenciasLocales(textoUsuario, db) {
    const textoLimpio = normalizarParaSugerencias(textoUsuario);
    if (textoLimpio.length < 2) return [];

    const terminosUsuario = textoLimpio.split(' ');
    const resultados = [];
    const idsAgregados = new Set();

    db.forEach(alimento => {
        const candidatos = [alimento.nombre, ...(alimento.alias || [])];
        let coincidenciaFuerte = false;

        candidatos.forEach(aliasText => {
            if (coincidenciaFuerte) return;
            const palabrasAlias = normalizarParaSugerencias(aliasText).split(' ');
            const matchCompleto = terminosUsuario.every(termUser =>
                palabrasAlias.some(palabra => palabra.startsWith(termUser))
            );
            if (matchCompleto) coincidenciaFuerte = true;
        });

        if (coincidenciaFuerte && !idsAgregados.has(alimento.nombre)) {
            resultados.push(alimento);
            idsAgregados.add(alimento.nombre);
        }
    });
    return resultados.slice(0, 8);
}

function buscarAlimento(textoOriginal, db) {
    const userTokens = tokenizar(textoOriginal);
    if (userTokens.length === 0) return null;

    let mejor = null;
    let mejorScore = 0;

    for (const item of db) {
        const candidatos = [item.nombre, ...(item.alias || [])];
        for (const cand of candidatos) {
            const aliasTokens = tokenizar(cand);
            if (aliasTokens.length === 0) continue;
            const score = fuzzyMatch(aliasTokens, userTokens);
            const lengthBonus = Math.min(cand.length / 20, 0.2);
            const totalScore = score + lengthBonus;
            if (totalScore > mejorScore) {
                mejorScore = totalScore;
                mejor = item;
            }
        }
    }
    if (mejorScore < 0.6) return null;
    return mejor;
}

const extraerGramos = (textoOriginal, item) => {
    const texto = normalizarParaSugerencias(textoOriginal);
    const matchPeso = texto.match(/(\d+(?:[.,]\d+)?)\s*(kg|kilos?|kilogramos?|gr|grs|gramos?|g)\b/);
    if (matchPeso) {
        let cantidad = parseFloat(matchPeso[1].replace(',', '.'));
        if (/kg|kilo/.test(matchPeso[2])) cantidad *= 1000;
        return { gramos: Math.round(cantidad), detectado: true };
    }
    if (item && item.unidad) {
        const matchDigito = texto.match(/(\d+(?:[.,]\d+)?)\s*(unidades?|piezas?)?/);
        const palabras = texto.split(/\s+/);
        let cantidadUnidades = null;
        const NUMERO_PALABRA = { 'un':1,'una':1,'uno':1,'dos':2,'tres':3,'cuatro':4,'cinco':5,'seis':6,'siete':7,'ocho':8,'medio':0.5,'media':0.5 };
        for (const palabra of palabras) {
            if (NUMERO_PALABRA[palabra] !== undefined) { cantidadUnidades = NUMERO_PALABRA[palabra]; break; }
        }
        if (cantidadUnidades === null && matchDigito && matchDigito[1] && !matchPeso) {
            cantidadUnidades = parseFloat(matchDigito[1].replace(',', '.'));
        }
        if (cantidadUnidades) {
            return { gramos: Math.round(item.unidad * cantidadUnidades), detectado: true };
        }
    }
    return { gramos: item && item.unidad ? item.unidad : 100, detectado: false };
};

const calcularMacrosPorPeso = (item, gramos) => {
    const factor = gramos / 100;
    return {
        alimento: item.nombre,
        calorias: Math.round(item.cal * factor),
        proteinas: Math.round(item.prot * factor * 10) / 10,
        carbohidratos: Math.round(item.carb * factor * 10) / 10,
        grasas: Math.round(item.gras * factor * 10) / 10,
        gramos: Math.round(gramos)
    };
};

            const oldCustoms = JSON.parse(oldCustomsData);
            if (oldCustoms.length > 0) {
                const merged = [...INITIAL_FOOD_DB];
                oldCustoms.forEach(cf => {
                    const idx = merged.findIndex(f => f.nombre.toLowerCase() === cf.nombre.toLowerCase());
                    if (idx >= 0) merged[idx] = cf;
                    else merged.unshift(cf); // Añadir al principio
                });
                localStorage.setItem(DATABASE_KEY, JSON.stringify(merged));
                return merged;
            }
        }
    } catch(e) {}
    return INITIAL_FOOD_DB;
};

const loadEntries = () => { try { const s = localStorage.getItem(STORAGE_KEY); if (s) return JSON.parse(s); } catch(e) {} return []; };
const saveEntries = (list) => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); } catch(e) {} };
const loadProfile = () => { try { const s = localStorage.getItem(PROFILE_KEY); if (s) return JSON.parse(s); } catch(e) {} return null; };
const saveProfile = (profile) => { try { localStorage.setItem(PROFILE_KEY, JSON.stringify(profile)); } catch(e) {} };
const loadClosedDays = () => { try { const s = localStorage.getItem(CLOSED_DAYS_KEY); if (s) return JSON.parse(s); } catch(e) {} return []; };
const saveClosedDays = (days) => { try { localStorage.setItem(CLOSED_DAYS_KEY, JSON.stringify(days)); } catch(e) {} };
const todayStr = () => fechaLocalStr();
const formatFechaAmigable = (fechaStr) => {
    const hoy = new Date(); hoy.setHours(0,0,0,0);
    const ayer = new Date(hoy); ayer.setDate(ayer.getDate() - 1);
    const fecha = new Date(fechaStr + 'T00:00:00');
    if (fecha.getTime() === hoy.getTime()) return 'Hoy';
    if (fecha.getTime() === ayer.getTime()) return 'Ayer';
    const diffDias = Math.floor((hoy.getTime() - fecha.getTime()) / 86400000);
    if (diffDias < 7 && diffDias >= 0) {
        const dias = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
        return dias[fecha.getDay()];
    }
    return `${fecha.getDate()} ${fecha.toLocaleString('es', { month: 'short' })}`;
};

// ============================================================

    useEffect(() => {

        }
    }, [toast]);

    const toggleTheme = () => setTheme(prev => prev === 'dark' ? 'light' : 'dark');

    const calcularObjetivoDesde = (p) => {
        if (!p) return null;
        const sexo = p.sexo;
        const edad = Number(p.edad) || 0;
        const altura = Number(p.altura) || 0;
        const peso = Number(p.peso) || 0;
        const actividad = Number(p.actividad) || 0;
        let tmb = sexo === 'hombre' ? 10 * peso + 6.25 * altura - 5 * edad + 5 : 10 * peso + 6.25 * altura - 5 * edad - 161;
        const factorActividad = [1.2, 1.375, 1.55, 1.725, 1.9][actividad] || 1.2;
        const get = tmb * factorActividad;
        let objetivo, deficit;
        if (p.modoObjetivo === 'directo') {
            objetivo = Math.max(0, Number(p.objetivoDirecto) || 0);
            deficit = Math.round(get - objetivo);
        } else {
            deficit = Number(p.deficit) || 0;
            objetivo = Math.max(0, get - deficit);
        }
        return { tmb, get, objetivo, deficit };
    };

    const calcularObjetivo = useMemo(() => calcularObjetivoDesde(profile), [profile]);
    const todayKey = todayStr();
    const isTodayClosed = closedDays.includes(todayKey);

    const todayEntries = useMemo(() => {
        if (isTodayClosed) return [];
        return entries.filter(e => e.date === todayKey).sort((a,b) => b.id - a.id);
    }, [entries, todayKey, isTodayClosed]);

    const todayTotals = useMemo(() => todayEntries.reduce((acc, e) => ({
        kcal: acc.kcal + e.calorias, prot: acc.prot + e.proteinas, carb: acc.carb + e.carbohidratos, fat: acc.fat + e.grasas,
    }), { kcal: 0, prot: 0, carb: 0, fat: 0 }), [todayEntries]);

    const pastDays = useMemo(() => {
        const byDay = {};
        entries.forEach(e => {
            if (e.date === todayKey || closedDays.includes(e.date)) return;
            byDay[e.date] = (byDay[e.date] || 0) + e.calorias;
        });
        return Object.keys(byDay).sort().reverse().map(d => ({ date: d, kcal: byDay[d] }));
    }, [entries, todayKey, closedDays]);

    const groupedHistory = useMemo(() => {
        const groups = {};
        entries.forEach(e => {
            if (!groups[e.date]) groups[e.date] = [];
            groups[e.date].push(e);
        });
        return Object.keys(groups).sort().reverse().map(date => ({
            date,
            entries: groups[date].sort((a,b) => b.id - a.id)
        }));
    }, [entries]);

    const progreso = useMemo(() => {
        if (!calcularObjetivo) return null;
        const objetivo = calcularObjetivo.objetivo;
        if (objetivo === 0) return { porcentaje: 0, restante: 0, estado: 'sin_objetivo' };
        const consumido = todayTotals.kcal;
        const porcentaje = (consumido / objetivo) * 100;
        let estado = 'deficit'; let color = 'emerald';
        if (porcentaje > 110) { estado = 'superavit'; color = 'rose'; }
        else if (porcentaje > 100) { estado = 'equilibrio'; color = 'amber'; }
        const restante = Math.round(objetivo - consumido);
        return { porcentaje: Math.min(porcentaje, 150), restante, estado, color, consumido, objetivo };
    }, [todayTotals.kcal, calcularObjetivo]);

    // ============================================================
    // LÓGICA DE BÚSQUEDA Y APRENDIZAJE
    // ============================================================
    const aplicarResultado = (resultado, origen) => {
        setCalculatedMacros(resultado);
        setFormData(prev => ({ ...prev, alimento: resultado.alimento, peso: String(resultado.gramos) }));
        if (origen === 'voice') { setEditingId(null); setModalOpen(true); }
        setToast(`✅ "${resultado.alimento}" · ${resultado.gramos} g`);
    };

    const analyzeLocal = (userText, gramosManual, origen) => {
        const itemDirecto = buscarAlimento(userText, database);
        if (itemDirecto) {
            lastMatchRef.current = itemDirecto;
            let gramos = (gramosManual && Number(gramosManual) > 0) ? Number(gramosManual) : extraerGramos(userText, itemDirecto).gramos;
            aplicarResultado(calcularMacrosPorPeso(itemDirecto, gramos), origen);

        }
        setPendingCustomFood({ alimento: userText, peso: gramosManual || '100', fecha: formData.fecha || todayStr(), origen });

    };

    const guardarAlimentoCustom = () => {

        setDatabase(prev => {
            const next = [customFood, ...prev]; // Lo añade al principio de la BD

        });

        const resultado = calcularMacrosPorPeso(customFood, gramos);
        setCalculatedMacros(resultado);
        setFormData(prev => ({ ...prev, alimento: pendingCustomFood.alimento, peso: String(gramos), fecha: pendingCustomFood.fecha }));

        if (pendingCustomFood.origen === 'voice' || pendingCustomFood.origen === 'modal') { setEditingId(null); setModalOpen(true); }
        setToast('✅ Alimento aprendido y añadido a la Base de Datos');

    //  GESTOR DE BASE DE DATOS
    // ============================================================

    };

    const handleOpenEditFood = (originalIdx) => {

    const handleDeleteFood = (originalIdx) => {
        if (!confirm('¿Eliminar este alimento de la base de datos? No se puede deshacer.')) return;

            prot: Number(foodForm.prot) || 0,
            carb: Number(foodForm.carb) || 0,
            gras: Number(foodForm.gras) || 0,
            unidad: Number(foodForm.unidad) || 100,

    const handleClearHistory = () => { if (confirm('¿Borrar todo el historial? No se puede deshacer.')) { setEntries([]); setToast('🗑️ Historial borrado'); } };

    const previewObjetivo = useMemo(() => calcularObjetivoDesde(profileForm), [profileForm]);

    const handleSaveProfile = () => {

    const startVoiceRecognition = () => {

        rec.lang = 'es-ES'; rec.continuous = false; rec.interimResults = false; rec.maxAlternatives = 1;

                            </div>
                            {(profileForm.modoObjetivo || 'deficit') === 'deficit' ? (
                                <div><label className="text-[12px] font-bold text-slate-400 uppercase tracking-widest mb-1 block">Déficit respecto a tu mantenimiento (kcal/día)</label><input type="number" inputMode="numeric" value={profileForm.deficit} onChange={e => setProfileForm({ ...profileForm, deficit: e.target.value })} className="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-indigo-500" min="0" step="50" /><p className="text-[10px] text-slate-400 mt-1">Recomendado: 500 kcal para perder ~0.5 kg/semana.</p></div>
                            ) : (
                                <div><label className="text-[12px] font-bold text-slate-400 uppercase tracking-widest mb-1 block">Cuántas kcal quieres comer al día</label><input type="number" inputMode="numeric" value={profileForm.objetivoDirecto} onChange={e => setProfileForm({ ...profileForm, objetivoDirecto: e.target.value })} className="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-indigo-500" min="0" step="50" placeholder="Ej: 2000" /><p className="text-[10px] text-slate-400 mt-1">Este es tu objetivo tal cual.</p></div>
                            )}
                            {previewObjetivo && (<p className="text-xs font-bold text-indigo-400 mt-1 bg-indigo-500/10 border border-indigo-500/20 rounded-lg px-3 py-2">🎯 Con estos datos, tu objetivo sería: {Math.round(previewObjetivo.objetivo)} kcal/día</p>)}
                            <div className="flex gap-2 mt-2">
                                <button type="submit" className="flex-1 py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-black text-sm transition-all shadow-lg active:scale-95">GUARDAR PERFIL</button>
                                <button type="button" onClick={() => setProfileModalOpen(false)} className="py-3.5 px-4 bg-white/5 hover:bg-white/10 text-slate-400 rounded-xl font-bold text-sm transition-all active:scale-95">CANCELAR</button>
                            </div>
                        </form>
                    </div>
                </div>, document.body
            )}

            {/* MODAL BASE DE DATOS (ANTIGUO MIS ALIMENTOS) */}
            {manageFoodsOpen && ReactDOM.createPortal(
                <div className="modal-overlay bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center z-50 p-0 sm:p-4">
                    <div className="bg-[#0f111a] border border-white/10 p-6 rounded-t-[2.5rem] sm:rounded-[2rem] w-full max-w-md shadow-2xl animate-fade max-h-[85vh] flex flex-col">
                        <div className="flex justify-between items-center mb-4 shrink-0">
                            <h3 className="text-base font-black text-white">🗂️ Base de Datos</h3>
                            <button onClick={() => setManageFoodsOpen(false)} className="text-slate-400 hover:text-white transition-colors p-1"><i className="fa-solid fa-xmark text-lg"></i></button>
                        </div>
                        
                        <div className="shrink-0 space-y-3 mb-3">
                            <button onClick={handleOpenNewFood} className="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-black text-sm transition-all shadow-lg active:scale-95 flex items-center justify-center gap-2">
                                <i className="fa-solid fa-plus"></i> NUEVO ALIMENTO
                            </button>
                            <div className="relative">
                                <i className="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                                <input type="text" placeholder="Buscar alimento..." value={dbSearch} onChange={(e) => setDbSearch(e.target.value)} className="w-full bg-white/5 border border-white/10 rounded-xl py-2.5 pl-10 pr-3 text-white text-sm focus:outline-none focus:border-indigo-500" />
                            </div>
                            <p className="text-[11px] text-slate-400 text-center">
                                Controlas {database.length} alimentos. Tienes el poder absoluto sobre tu catálogo.
                            </p>
                        </div>

                        <div className="space-y-2 overflow-y-auto custom-scrollbar pr-1 pb-4">
                            {database.map((f, originalIdx) => {
                                if (dbSearch && !f.nombre.toLowerCase().includes(dbSearch.toLowerCase())) return null;
                                return (
                                    <div key={f.nombre + originalIdx} className="p-3 rounded-xl bg-black/40 border border-white/5 text-xs">
                                        <div className="flex justify-between items-center">
                                            <div>
                                                <p className="font-bold text-white">{f.nombre}</p>
                                                <p className="text-[11px] text-slate-400 mt-0.5">{f.cal} kcal · {f.prot}p / {f.carb}c / {f.gras}g · por {f.unidad}g</p>
                                            </div>
                                            <div className="flex gap-1">
                                                <button onClick={() => handleOpenEditFood(originalIdx)} className="text-slate-400 hover:text-indigo-400 p-2"><i className="fa-solid fa-pen text-xs"></i></button>
                                                <button onClick={() => handleDeleteFood(originalIdx)} className="text-slate-400 hover:text-rose-400 p-2"><i className="fa-solid fa-trash text-xs"></i></button>
                                            </div>
                                        </div>
                                        {f.receta && <p className="text-[10px] text-slate-400 mt-2 italic border-t border-white/5 pt-2">{f.receta}</p>}
                                    </div>
                                );
                            })}
                            
                            <div className="pt-6 pb-2 text-center">
                                <button onClick={() => {
                                    if (confirm('¿Restaurar la base de datos de fábrica? Se perderán TODOS los alimentos que hayas añadido o modificado.')) {
                                        setDatabase(INITIAL_FOOD_DB);
                                        localStorage.setItem(DATABASE_KEY, JSON.stringify(INITIAL_FOOD_DB));
                                        setDbSearch('');
                                        setToast('✅ Base de datos restaurada');
                                    }
                                }} className="text-[10px] text-rose-400 font-bold uppercase tracking-wider hover:underline">
                                    Restaurar Fábrica
                                </button>
                            </div>
                        </div>
                    </div>
                </div>, document.body
            )}

            {/* MODAL CREAR/EDITAR ALIMENTO */}
            {foodFormOpen && ReactDOM.createPortal(
                <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center z-[80] p-0 sm:p-4">
                    <div className="bg-[#0f111a] border border-white/10 p-6 rounded-t-[2.5rem] sm:rounded-[2rem] w-full max-w-sm shadow-2xl animate-fade">
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="text-base font-black text-white">{foodEditingIndex !== null ? 'Editar alimento' : 'Nuevo alimento'}</h3>
                            <button onClick={() => setFoodFormOpen(false)} className="text-slate-400 hover:text-white transition-colors p-1"><i className="fa-solid fa-xmark text-lg"></i></button>
                        </div>
                        <form onSubmit={handleSaveFood} className="space-y-3">
                            <div><label className="text-[12px] font-bold text-slate-400 uppercase tracking-widest mb-1 block">Nombre</label><input type="text" value={foodForm.nombre} onChange={e => setFoodForm({ ...foodForm, nombre: e.target.value })} className="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-indigo-500" placeholder="Ej: Potaje de berros" required /></div>
                            <div><label className="text-[12px] font-bold text-slate-400 uppercase tracking-widest mb-1 block">Alias (opcional, separados por coma)</label><input type="text" value={foodForm.alias} onChange={e => setFoodForm({ ...foodForm, alias: e.target.value })} className="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-indigo-500" placeholder="Ej: potaje, potaje canario" /><p className="text-[10px] text-slate-400 mt-1">Ayuda a la voz a encontrarlo aunque lo digas distinto.</p></div>
                            <div className="grid grid-cols-2 gap-3">
                                <div><label className="text-[12px] font-bold text-slate-400 uppercase tracking-widest mb-1 block">Calorías /100g</label><input type="number" inputMode="numeric" value={foodForm.cal} onChange={e => setFoodForm({ ...foodForm, cal: e.target.value })} className="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-indigo-500" placeholder="0" required /></div>
                                <div><label className="text-[12px] font-bold text-slate-400 uppercase tracking-widest mb-1 block">Ración típica (g)</label><input type="number" inputMode="numeric" value={foodForm.unidad} onChange={e => setFoodForm({ ...foodForm, unidad: e.target.value })} className="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-indigo-500" placeholder="100" /></div>
                            </div>
                            <div className="grid grid-cols-3 gap-3">
                                <div><label className="text-[11px] font-bold text-emerald-400 uppercase tracking-widest mb-1 block">Prot. /100g</label><input type="number" inputMode="numeric" value={foodForm.prot} onChange={e => setFoodForm({ ...foodForm, prot: e.target.value })} className="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-emerald-500" placeholder="0" /></div>
                                <div><label className="text-[11px] font-bold text-amber-400 uppercase tracking-widest mb-1 block">Carb. /100g</label><input type="number" inputMode="numeric" value={foodForm.carb} onChange={e => setFoodForm({ ...foodForm, carb: e.target.value })} className="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-amber-500" placeholder="0" /></div>
                                <div><label className="text-[11px] font-bold text-rose-400 uppercase tracking-widest mb-1 block">Grasa /100g</label><input type="number" inputMode="numeric" value={foodForm.gras} onChange={e => setFoodForm({ ...foodForm, gras: e.target.value })} className="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-rose-500" placeholder="0" /></div>
                            </div>
                            <div><label className="text-[12px] font-bold text-slate-400 uppercase tracking-widest mb-1 block">Receta / notas (opcional)</label><textarea value={foodForm.receta} onChange={e => setFoodForm({ ...foodForm, receta: e.target.value })} rows="3" className="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-indigo-500 resize-none" placeholder="Ej: 150g pechuga, 100g arroz..."></textarea></div>
                            <div className="flex gap-2 mt-2">
                                <button type="submit" className="flex-1 py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-black text-sm transition-all shadow-lg active:scale-95">{foodEditingIndex !== null ? 'ACTUALIZAR' : 'GUARDAR'}</button>
                                <button type="button" onClick={() => setFoodFormOpen(false)} className="py-3.5 px-4 bg-white/5 hover:bg-white/10 text-slate-400 rounded-xl font-bold text-sm transition-all active:scale-95">CANCELAR</button>
                            </div>
                        </form>
                    </div>
                </div>, document.body
            )}

            {/* MODAL PLATOS COMBINADOS Y EL RESTO IGUAL... */}
            {platosModalOpen && ReactDOM.createPortal(
                <div className="modal-overlay bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center z-50 p-0 sm:p-4">
                    <div className="bg-[#0f111a] border border-white/10 p-6 rounded-t-[2.5rem] sm:rounded-[2rem] w-full max-w-md shadow-2xl animate-fade max-h-[85vh] flex flex-col">
                        <div className="flex justify-between items-center mb-1 shrink-0">
                            <h3 className="text-base font-black text-white">🍽️ Platos combinados</h3>
                            <button onClick={() => setPlatosModalOpen(false)} className="text-slate-400 hover:text-white transition-colors p-1"><i className="fa-solid fa-xmark text-lg"></i></button>
                        </div>
                        <p className="text-[11px] text-slate-400 mb-3 shrink-0">Toca un plato para ver su receta, ingredientes y calorías.</p>
                        <div className="space-y-2 overflow-y-auto custom-scrollbar pr-1">
                            {PLATOS_COMBINADOS.map(item => (
                                <button key={item.nombre} onClick={() => setPlatoDetalle(item)} className="w-full text-left p-3 rounded-xl bg-black/40 border border-white/5 text-xs hover:border-indigo-500/30 transition-colors">
                                    <div className="flex justify-between items-center"><p className="font-bold text-white pr-2">{item.nombre}</p><span className="font-black text-indigo-400 whitespace-nowrap">{Math.round(item.cal * item.unidad / 100)} kcal</span></div>
                                    <p className="text-[10px] text-slate-400 mt-0.5">Ración: {item.unidad}g</p>
                                </button>
                            ))}
                        </div>
                    </div>
                </div>, document.body
            )}

            {platoDetalle && ReactDOM.createPortal(
                <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center z-[80] p-0 sm:p-4">
                    <div className="bg-[#0f111a] border border-white/10 p-6 rounded-t-[2.5rem] sm:rounded-[2rem] w-full max-w-sm shadow-2xl animate-fade max-h-[85vh] flex flex-col">
                        <div className="flex justify-between items-center mb-3 shrink-0">
                            <h3 className="text-base font-black text-white pr-2">{platoDetalle.nombre}</h3>
                            <button onClick={() => setPlatoDetalle(null)} className="text-slate-400 hover:text-white transition-colors p-1 shrink-0"><i className="fa-solid fa-xmark text-lg"></i></button>
                        </div>
                        <div className="overflow-y-auto custom-scrollbar pr-1 space-y-4">
                            <div className="grid grid-cols-4 gap-2">
                                <div className="bg-black/40 rounded-xl p-2 text-center"><div className="font-black text-indigo-400 text-sm">{Math.round(platoDetalle.cal * platoDetalle.unidad / 100)}</div><div className="text-[9px] text-slate-400 uppercase">kcal</div></div>
                                <div className="bg-emerald-500/10 border border-emerald-500/20 rounded-xl p-2 text-center"><div className="font-black text-emerald-400 text-sm">{Math.round(platoDetalle.prot * platoDetalle.unidad / 100)}g</div><div className="text-[9px] text-slate-400 uppercase">Prot</div></div>
                                <div className="bg-amber-500/10 border border-amber-500/20 rounded-xl p-2 text-center"><div className="font-black text-amber-400 text-sm">{Math.round(platoDetalle.carb * platoDetalle.unidad / 100)}g</div><div className="text-[9px] text-slate-400 uppercase">Carb</div></div>
                                <div className="bg-rose-500/10 border border-rose-500/20 rounded-xl p-2 text-center"><div className="font-black text-rose-400 text-sm">{Math.round(platoDetalle.gras * platoDetalle.unidad / 100)}g</div><div className="text-[9px] text-slate-400 uppercase">Grasa</div></div>
                            </div>
                            <p className="text-[10px] text-slate-400 -mt-2">Para una ración de {platoDetalle.unidad}g. Los valores por 100g están en el catálogo.</p>
                            {RECIPES[platoDetalle.nombre] && (
                                <>
                                    <div className="flex gap-2 flex-wrap">
                                        <span className="text-[10px] font-bold bg-white/5 border border-white/10 rounded-full px-3 py-1.5 text-slate-300"><i className="fa-regular fa-clock mr-1"></i>Prep: {RECIPES[platoDetalle.nombre].tiempoPrep}</span>
                                        <span className="text-[10px] font-bold bg-white/5 border border-white/10 rounded-full px-3 py-1.5 text-slate-300"><i className="fa-solid fa-fire mr-1"></i>Cocción: {RECIPES[platoDetalle.nombre].tiempoCoccion}</span>
                                        <span className="text-[10px] font-bold bg-white/5 border border-white/10 rounded-full px-3 py-1.5 text-slate-300"><i className="fa-solid fa-gauge mr-1"></i>{RECIPES[platoDetalle.nombre].dificultad}</span>
                                    </div>
                                    <div>
                                        <h4 className="text-[12px] font-bold text-slate-400 uppercase tracking-widest mb-2">Ingredientes (para {platoDetalle.unidad}g de ración)</h4>
                                        <div className="space-y-1.5">
                                            {RECIPES[platoDetalle.nombre].ingredientes.map((ing, i) => (
                                                <div key={i} className="flex justify-between text-xs bg-black/30 rounded-lg px-3 py-2"><span className="text-slate-300">{ing.nombre}</span><span className="text-white font-bold">{ing.gramos} g</span></div>
                                            ))}
                                        </div>
                                    </div>
                                    <div>
                                        <h4 className="text-[12px] font-bold text-slate-400 uppercase tracking-widest mb-2">Elaboración</h4>
                                        <ol className="space-y-2.5">
                                            {RECIPES[platoDetalle.nombre].pasos.map((paso, i) => (
                                                <li key={i} className="flex gap-2.5 text-xs text-slate-300 leading-relaxed"><span className="shrink-0 w-5 h-5 rounded-full bg-indigo-500/20 border border-indigo-500/30 text-indigo-400 font-black flex items-center justify-center text-[10px]">{i + 1}</span><span>{paso}</span></li>
                                            ))}
                                        </ol>
                                    </div>
                                </>
                            )}
                            <button onClick={() => handleRegistrarPlato(platoDetalle)} className="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-black text-sm transition-all shadow-lg active:scale-95">REGISTRAR ESTE PLATO</button>
                        </div>
                    </div>
                </div>, document.body
            )}

            {showCreator && ReactDOM.createPortal(
                <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-[70] p-4">
                    <div className="bg-[#0f111a] border border-white/10 p-8 rounded-[2rem] w-full max-w-sm shadow-2xl animate-fade text-center relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-indigo-500 via-purple-500 to-emerald-500"></div>
                        <div className="w-20 h-20 mx-auto rounded-full flex items-center justify-center mb-4 shadow-[0_0_35px_rgba(99,102,241,0.35)]" style={{ background: 'linear-gradient(135deg, #6366f1 0%, #a855f7 55%, #10b981 100%)' }}><svg viewBox="0 0 24 24" className="w-10 h-10" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 2c-.6 2.4-2.2 3.7-3.5 5.2C7 9 6 10.7 6 13a6 6 0 0 0 12 0c0-2.6-1.4-4.4-2.6-6-.4.9-1 1.7-1.8 2.1.2-2.6-.6-4.8-1.6-7.1Z" fill="white"/><path d="M12 20a4 4 0 0 1-4-4c0-1.4.7-2.3 1.5-3.2.2 1 .8 1.7 1.6 2 0-1.3.4-2.3 1-3.3.7 1.1 1.9 2 1.9 3.5a4 4 0 0 1-2 4Z" fill="#0f111a" opacity="0.55"/></svg></div>
                        <h3 className="text-xl font-black text-white mb-2">Calorímetro</h3>
                        <p className="text-sm text-slate-400 mb-6 leading-relaxed">Software de conteo calórico desarrollado y diseñado exclusivamente por <br/><strong className="text-white">Jonathan Pérez Galán</strong>.</p>
                        <button onClick={() => setShowCreator(false)} className="w-full py-3 bg-white/10 hover:bg-white/20 text-white rounded-xl font-bold text-xs transition-all">CERRAR</button>
                    </div>
                </div>, document.body
            )}

            {showGuide && ReactDOM.createPortal(
                <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-[70] p-4">
                    <div className="bg-[#0f111a] border border-white/10 rounded-[2rem] w-full max-w-2xl shadow-2xl animate-fade max-h-[85vh] flex flex-col overflow-hidden">
                        <div className="flex justify-between items-center px-6 pt-6 pb-4 border-b border-white/10 shrink-0">
                            <h3 className="text-lg font-black text-white flex items-center gap-2"><i className="fa-solid fa-circle-question text-indigo-400"></i> Guía de Usuario</h3>
                            <button onClick={() => setShowGuide(false)} className="text-slate-400 p-1"><i className="fa-solid fa-xmark text-lg"></i></button>
                        </div>
                        <div className="flex gap-2 px-6 pt-4 flex-wrap shrink-0">
                            {[{ id: 'voz', label: 'Voz', icon: 'fa-microphone' }, { id: 'historial', label: 'Historial', icon: 'fa-clock-rotate-left' }, { id: 'perfil', label: 'Perfil', icon: 'fa-user' }, { id: 'alimentos', label: 'Base de Datos', icon: 'fa-database' }].map(t => (
                                <button key={t.id} onClick={() => setGuideTab(t.id)} className={`px-4 py-2 rounded-xl text-xs font-black uppercase tracking-widest transition-all flex items-center gap-2 ${guideTab === t.id ? 'bg-indigo-600 text-white' : 'bg-white/5 text-slate-400 hover:bg-white/10'}`}><i className={`fa-solid ${t.icon}`}></i> {t.label}</button>
                            ))}
                        </div>
                        <div className="px-6 py-5 overflow-y-auto custom-scrollbar text-sm text-slate-300 leading-relaxed space-y-3">
                            {guideTab === 'voz' && (<><h4 className="text-white font-black text-base">Cómo dictar tu comida</h4><p>Toca el micrófono grande y describe lo que has comido, indicando la cantidad: <span className="text-white font-bold">"200 gramos de pechuga de pollo"</span>.</p></>)}
                            {guideTab === 'historial' && (<><h4 className="text-white font-black text-base">Historial Detallado</h4><p>Usa el icono del reloj en la barra superior para ver todos tus registros antiguos organizados por día. Desde ahí puedes modificarlos o borrarlos fácilmente.</p></>)}
                            {guideTab === 'perfil' && (<><h4 className="text-white font-black text-base">Perfil y objetivo</h4><p>Configura tu perfil para fijar tu objetivo calórico diario y llevar tu control desde la pantalla inicial.</p></>)}
                            {guideTab === 'alimentos' && (<><h4 className="text-white font-black text-base">Gestor de Base de Datos</h4><p>El icono de discos de la cabecera te lleva a tu catálogo completo. Todo es editable, incluso los alimentos de fábrica. Tienes un buscador en la parte superior y un botón para restaurar de fábrica al final.</p></>)}
                        </div>
                    </div>
                </div>, document.body
            )}
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
